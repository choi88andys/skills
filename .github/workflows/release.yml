name: Auto Release on Tag

# A release tag (immutable--vX.Y.Z) creates the GitHub Release and moves the major
# channel tag (immutable--vX) to the same commit.
#
# WHY A CHANNEL TAG
# Every consumer CI pinned an exact tag, so each release meant editing IMMUTABLE_REF
# in every repo that runs the validator, and the repos drifted apart: on 2026-11-20
# the two spec repos ran v0.21.2, the tracker v0.19.0, did_client v0.9.0 and
# lounge-x-app v0.17.0. A repo that sets IMMUTABLE_REF to the channel follows every
# release of that major with no edit; one that wants a frozen gate keeps an exact tag.
# A new major is a new channel, so a breaking release still reaches no one who did
# not move to it.
#
# WHY THE CHANNEL MOVES ONLY FORWARD
# A patch cut on an older line after a newer release (v0.20.5 after v0.21.2) would
# otherwise drag every channel consumer back to it. The channel goes to the highest
# version of its major, which is this tag only when nothing newer exists.
#
# WHY THE PUSH CANNOT LOOP
# The channel tag matches this workflow's own trigger, but a push made with
# GITHUB_TOKEN starts no workflow. A channel tag pushed by hand (recovery) does start
# one; the release step skips any tag that is not a full X.Y.Z version.

on:
  push:
    tags:
      - 'immutable--v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Skip a tag that is not a full release version
        id: kind
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^immutable--v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "channel=immutable--v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is not immutable--vX.Y.Z (a channel tag or a typo): no release, no channel move."
          fi

      - name: Checkout (full history for release notes)
        if: ${{ steps.kind.outputs.release == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        if: ${{ steps.kind.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#immutable--}"
          gh release create "$TAG" \
            --title "$VERSION" \
            --generate-notes

      - name: Move the major channel tag to this release
        if: ${{ steps.kind.outputs.release == 'true' }}
        env:
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ steps.kind.outputs.channel }}
        run: |
          git fetch --force --tags origin
          newest="$(git tag -l "${CHANNEL}.*.*" | grep -E "^${CHANNEL}\.[0-9]+\.[0-9]+$" | sort -V | tail -1)"
          if [ "$newest" != "$TAG" ]; then
            echo "$TAG is not the newest ${CHANNEL} release ($newest is): channel left where it is."
            exit 0
          fi
          git tag -f "$CHANNEL" "$TAG^{commit}"
          git push --force origin "refs/tags/$CHANNEL"
          echo "$CHANNEL -> $TAG ($(git rev-parse --short "$TAG^{commit}"))"
