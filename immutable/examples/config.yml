# Example .immutable-prd/config.yml for a two-repo SDD project — SPEC repo side.
#
# Place at: <spec-repo-root>/.immutable-prd/config.yml
# The /immutable:prd skill reads this file. If absent, the skill falls back to
# inferred defaults (see ../SCHEMA.md).
#
# For the APP repo side (ADR companion), use config-two-repo-app.yml.

version: 2

# Repository mode.
#   two-repo-spec: this is the spec repo (pitches only)
#   two-repo-app:  this is the app repo (adr only)
#   single-repo:   both pitches and adr live in this repo
repo_mode: two-repo-spec

# Team working language for user-facing prompts.
team_language: ko

# Path to pitches (required; relative to repo root).
pitches_path: pitches/

# Template paths (optional; defaults derived from pitches_path).
templates:
  pitch: pitches/TEMPLATE.md

# Requirement contract (v0.11+, optional).
#
# Declare this when pitches in this repo are authored against tracker tickets
# whose designated sections bind them (immutable/SCHEMA.md "Requirement
# contract"). Absent → /immutable:prd never mentions tickets and the validator
# checks nothing new. The binding headings, the three deviation categories and
# the disagreement vocabulary come from the profile.
#
# requirement_contract:
#   enforcement: optional        # optional | required
#   tracker: github              # label recorded in each pitch's references.tickets[]
#   repo: my-org/task-tracker    # default repository for a bare ticket id
#   since: 2026-01-01            # adoption date — under required, older pitches are exempt
#   # fetch_command: "python3 tools/ticket.py {id}"   # custom adapter; unset → gh api graphql
