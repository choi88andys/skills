# strings.ko.yml — Korean workflow prompts for immutable SDD skills.
#
# PURPOSE
#   SSoT for SKILL.md prose: Stage questions, refusal messages, confirmation
#   templates, handoff blocks. Profile YAML owns structural i18n (section
#   headings, persona names, gate criteria labels) — this catalog owns
#   workflow scaffolding that is NOT tied to a structured data item's id.
#
# RESOLUTION ORDER (skill lookup)
#   1. ${CLAUDE_PLUGIN_ROOT}/strings/strings.<team_language>.yml  (primary)
#   2. strings.en.yml                                             (fallback, warns once per missing key)
#   3. Hardcoded English fallback inside SKILL.md                 (last resort, warns once)
#
# INTERPOLATION
#   Single-brace mustache: {placeholder}. Placeholders are snake_case.
#   The skill performs dict substitution — no conditionals, no loops.
#   Branching is expressed by separate keys, not conditionals inside a value.
#
# KEY NAMING
#   <skill>.<stage>.<purpose>
#     <skill>   — init | prd | adr | common  (common = shared across skills)
#     <stage>   — stage1..stage6 OR functional group (intake, gate, handoff,
#                 anti_dumping, probe, intent_desc, placeholder)
#     <purpose> — descriptive snake_case
#
# RESPONSIBILITY SPLIT  (do NOT duplicate across catalog and profile)
#   Profile owns:  section headings, persona name/question/checks,
#                  gate criteria labels + pass_conditions, unresolved_tag,
#                  reserved domain descriptions, display_name,
#                  forbidden_slug reasons.
#   Catalog owns:  every user-facing prose string in SKILL.md prompts.

schema: 1
locale: ko

strings:
  # ==========================================================================
  # init skill
  # ==========================================================================

  init.stage1.probe_summary: |
    현재 디렉토리 상태:
    - .git: {git_status}
    - 기존 immutable 설정: {immutable_status}
    - 감지된 디렉토리: {detected_dirs}
    - 추천 모드: {recommended_mode}
    - 추천 근거: {recommendation_reason}

  init.stage1.already_initialized: |
    이 디렉토리는 이미 immutable로 초기화되어 있습니다 (.immutable-prd/config.yml 존재).

    옵션:
    - v2 → v3 업그레이드: `/immutable:migrate` 실행 (idempotent, zero-data-loss)
    - 재-부트스트랩: `.immutable-prd/config.yml`을 먼저 삭제한 뒤 `/immutable:init` 재실행
    - 추가 starter 적용 (single → two-repo 분리 등): 별도 디렉토리에서 init 실행 후 수동 통합

    작업을 중단합니다.

  init.stage2.mode_question: |
    어떤 starter로 시작할까요?

    (1) two-repo-spec — 스펙 전용 레포 (pitches/만, sibling app repo와 분리 운영)
    (2) two-repo-app — 앱 전용 레포 (adr/만, sibling spec repo 참조)
    (3) single-repo — pitches + adr 합본 레포 (작은 팀 / 단일 레포 운영 시)

    [추천: ({recommended_number}) — {recommendation_reason}]

    번호 또는 옵션 이름으로 선택해주세요.

  init.stage2.mode_conflict_warning: |
    선택한 모드({chosen_mode})는 감지된 코드 디렉토리({detected_dirs})와 어울리지 않습니다. 보통 {suggested_alternatives}이 적합합니다. 그래도 진행하시겠습니까?

  init.stage3.language_question: |
    팀 작업 언어를 선택해주세요:

    (1) Korean (ko) — 기본
    (2) English (en)

    [추천: (1)]

    번호로 선택해주세요. (다른 언어는 v0.6+ 지원 예정.)

  init.stage4.profile_question: |
    프로필 (섹션 헤딩, 적대적 리뷰 personas, 90% gate criteria 등 customization) 처리 방식:

    (1) bundled default 사용 — config.yml에 `profile:` 명시 안 함. 플러그인이 자동으로 default-<lang>를 로드. **권장 (가장 간단, 추후 변경 가능)**
    (2) repo-local 복사 — `.immutable-prd/profile.yml`로 default를 복사하고 config가 그것을 가리킴. 팀이 즉시 editable
    (3) skip 후 나중에 결정 — config에 주석으로만 남김 (현재는 동작 X와 동일)

    [추천: (1)]

  init.stage4.repo_local_hint: "프로필 파일을 직접 편집해서 sections / personas / gate threshold를 customize할 수 있습니다."

  init.stage4.skip_hint: "나중에 (2)로 전환하려면 `cp ${CLAUDE_PLUGIN_ROOT}/examples/_profiles/default-{lang}.yml .immutable-prd/profile.yml` 실행 후 config.yml의 `profile:` 라인 주석 해제."

  init.stage5.copy_report: |
    복사 완료 ({copied_count}개):
    {copied_list}

    건너뜀 (이미 존재, {skipped_count}개):
    {skipped_list}

  init.stage5.profile_copy_note: |
    - .immutable-prd/profile.yml (편집 가능)
    - .immutable-prd/config.yml에 profile: 라인 활성화됨

  init.stage5.spec_path_question: |
    spec repo 경로를 입력하세요 (app repo 기준 상대경로 또는 절대경로).
    비워두면 config.yml의 placeholder(`../<your-spec-repo>`)가 유지되고 나중에 직접 편집할 수 있습니다.
    {suggestion_hint}

  init.stage5.spec_path_suggestion: "감지된 spec repo 후보: `{path}` (그대로 쓰려면 Enter, 또는 다른 경로 입력)."

  init.stage5.spec_path_no_candidate: "인접 디렉토리에서 spec repo 후보를 찾지 못했습니다. 경로를 직접 입력하거나 비워두세요."

  init.stage5.spec_path_multiple: |
    인접 디렉토리에서 여러 spec repo 후보를 발견했습니다:
    {candidate_list}

    번호로 선택하거나 직접 경로를 입력하세요. 비워두면 나중에 편집합니다.

  init.stage5.spec_path_set: "`spec_repo_path: {path}` 설정 완료 (config.yml 편집됨)."

  init.stage5.spec_path_skipped: "placeholder 유지. 첫 `/immutable:adr` 실행 전에 `.immutable-prd/config.yml`의 `spec_repo_path:`를 직접 편집하세요."

  init.stage5.spec_path_missing_target: |
    주의: `{path}` 대상이 아직 존재하지 않거나 `.immutable-prd/config.yml` / `pitches/`가 없습니다.
    spec repo를 뒤이어 부트스트랩할 계획이라면 정상 — 해당 repo에서 `/immutable:init`을 실행하세요.
    config.yml은 입력한 경로로 저장됩니다.

  init.stage6.git_init_suggestion: |
    이 디렉토리는 git 레포가 아닙니다. 다음 명령으로 초기화할 수 있습니다:

    ```bash
    git init
    git add .
    git commit -m "feat: bootstrap immutable SDD"
    ```

    (스킬은 git 명령을 실행하지 않습니다. 위 명령을 직접 실행해주세요.)

  init.stage6.git_commit_suggestion: |
    기존 git 레포가 감지되었습니다. 다음 명령으로 변경사항을 커밋할 수 있습니다:

    ```bash
    git add .
    git commit -m "feat: bootstrap immutable SDD"
    ```

  init.stage7.handoff_two_repo_spec: |
    Bootstrap 완료 (mode: two-repo-spec, lang: {lang}).

    다음 단계:
    1. 위 Stage 6의 git 명령 실행
    2. `pitches/README.md`의 도메인 허용 목록 편집 — 예시 행을 실제 팀 도메인으로 교체
    3. 첫 pitch 작성: `/immutable:prd`

    참고:
    - Pitch 컨벤션 전체: `CONTRIBUTING.md`
    - ADR은 sibling app repo에서 따로 운영 (`/immutable:init` for app starter)

  init.stage7.handoff_two_repo_app_configured: |
    Bootstrap 완료 (mode: two-repo-app, lang: {lang}).

    `spec_repo_path: {spec_path}` 설정됨.

    다음 단계:
    1. 위 Stage 6의 git 명령 실행
    2. 첫 ADR 작성: `/immutable:adr`

    참고:
    - ADR 컨벤션: `adr/README.md`
    - Pitches는 spec repo에서 따로 작성 (`/immutable:prd` in that repo)

  init.stage7.handoff_two_repo_app_pending: |
    Bootstrap 완료 (mode: two-repo-app, lang: {lang}).

    다음 단계:
    1. 위 Stage 6의 git 명령 실행
    2. `.immutable-prd/config.yml`의 `spec_repo_path: ../<your-spec-repo>` 수정 — placeholder를 실제 spec repo 경로로 교체 (상대/절대경로 모두 가능; 네이밍 제약 없음)
    3. 첫 ADR 작성: `/immutable:adr`

    참고:
    - ADR 컨벤션: `adr/README.md`
    - Pitches는 spec repo에서 따로 작성 (`/immutable:prd` in that repo)

  init.stage7.handoff_single_repo: |
    Bootstrap 완료 (mode: single-repo, lang: {lang}).

    다음 단계:
    1. 위 Stage 6의 git 명령 실행
    2. `spec/pitches/README.md`의 도메인 허용 목록 편집
    3. 첫 pitch 작성: `/immutable:prd` (또는 첫 ADR: `/immutable:adr`)

    참고:
    - Pitch 컨벤션: `spec/CONTRIBUTING.md`
    - ADR 컨벤션: `adr/README.md`

  init.probe.status_present: "있음"
  init.probe.status_absent: "없음"
  init.probe.immutable_with_config: "있음 (config.yml 발견)"

  # ==========================================================================
  # prd skill
  # ==========================================================================

  prd.stage1.intent_question: "무엇을 작성하려고 하세요? 한두 문장으로 간단히 설명해주세요."

  prd.stage1.no_pitches_dir: "현재 디렉토리에 pitches/가 없습니다. 스펙 레포 루트에서 다시 실행해주세요."

  prd.stage1.confirmation: |
    [{domain}] {intent_desc}
    기준 파일: {base_file}
    인터뷰를 시작할까요?

    (1) 맞음 — 인터뷰 시작
    (2) 다른 도메인 — 직접 지정
    (3) 신규 도메인 — 허용 목록 추가 절차 안내
    (4) 폐기만 — 인터뷰 없이 deprecated 플립

  prd.intent_desc.new: "새 pitch 생성으로 이해했습니다"
  prd.intent_desc.new_domain: "새 도메인 + 새 pitch 생성으로 이해했습니다"
  prd.intent_desc.update: "도메인 업데이트로 이해했습니다"
  prd.intent_desc.deprecate_only: "폐기 처리로 이해했습니다"

  prd.stage1_5.intake_prompt_verbatim: |
    참고 자료가 있으면 첨부해주세요 (없으면 '없음'). 다음 중 해당되는 것만:

    (a) Figma — 단일 프레임 노드 URL, 1~3개
        예: figma.com/design/.../?node-id=123-456
        ※ 파일 전체 URL은 거절됩니다

    (b) Notion/Docs — feature 요약 페이지 1개
        ※ 워크스페이스 루트 URL 금지

    (c) 로컬 파일 — .md/.txt, 5페이지 이내

    (d) 텍스트 붙여넣기 — 정리된 요지, 30줄 이내
        채팅 로그 전체 X, 결정/요구사항 위주

  prd.stage1_5.summary_confirmation: "이 자료에서 다음을 읽었습니다. 해석이 맞습니까? 틀린 부분이나 이 pitch 범위 밖 내용이 있으면 지적해주세요."

  prd.stage1_5.scope_alignment: "이 자료들 중 이번 pitch에 담겨야 할 내용은 무엇이고, 자료에 없지만 pitch에 추가되어야 할 동작은 무엇입니까?"

  prd.stage3.identifier_warning: "본문에 코드 식별자 '`{identifier}`'가 있습니다. 도메인 용어로 바꿔주세요. (감지 패턴: {hint})"

  prd.stage6.handoff: |
    생성된 파일:
    - `{new_file_path}`
    {deprecated_line}

    등록 방법 (두 가지 중 택 1)

    {github_web_steps}

    {cli_steps}

  prd.stage6.deprecated_line: "- (update인 경우) `{old_file_path}` — deprecated: true로 플립됨"

  prd.stage6.missing_required_section: |
    파일 생성을 중단합니다. 프로파일이 요구하는 필수 섹션이 본문에 누락되었습니다.

    누락:
    {missing_headings}

    Stage 2 인터뷰로 돌아가 해당 섹션을 채운 뒤 Stage 6를 재진행해주세요.

  prd.stage6.missing_story_structure: |
    파일 생성을 중단합니다. 프로파일의 `sections[user_stories].structure = per_story_grouped` 조건에서 사용자 스토리 섹션 구조가 요구 조건을 만족하지 않습니다.

    문제:
    {offending_sections}

    규칙:
      1. 사용자 스토리 섹션(`## <heading>`) 아래에 `### ` 서브섹션이 **2개 이상** 있어야 합니다.
      2. 각 `### ` 서브섹션은 **bullet 시작(head)에 bracket**이 오는 normative 줄 1개 이상을 포함해야 합니다 (예: `- **[MUST]** …`, `- [MUST NOT] …`). nested bullet (`  - **[MUST]** …`)도 유효합니다.
      3. bullet 안 **문장 중간**에 bracket을 박으면 안 됩니다 (예: "- 시스템은 카드를 **[MUST]** 먼저 표시한다"). bullet 형태를 띠어도 bracket이 head 위치가 아니면 grep·CI 추출이 깨지고, 한국어 생성에서 특히 자주 나타나는 drift 패턴입니다.
      4. 문단 속 inline bracket도 동일하게 거부됩니다 (예: "시스템은 카드를 **[MUST]** 먼저 표시한다").
      5. GWT 블록은 권장이되 cross-cutting 그룹(예: 채널 전체 공통 결과 처리)에선 생략 가능합니다.
      6. normative 줄은 서브섹션 **안쪽**에만 두세요. H2와 첫 `### ` 사이로 새면 스토리 ↔ 수용조건 연결이 끊깁니다.

    Stage 2 Branch B로 돌아가 해당 내용을 보강한 뒤 Stage 6를 재진행해주세요.

  prd.stage3.inline_normative_warning: |
    본문에 bullet head 위치가 아닌 곳에 박힌 normative 키워드가 있습니다: "{line}"

    규칙: `[MUST]` / `[MUST NOT]` / `[SHOULD]` 같은 대괄호 키워드는 **bullet list 항목의 맨 앞**(옵션: `**`/`_` emphasis)에 두어야 합니다.
      - 허용: `- **[MUST]** 시스템은 …한다`, `  - [SHOULD] 시스템은 …한다`
      - 거부 (문단 inline): `시스템은 카드를 **[MUST]** 먼저 표시한다`
      - 거부 (bullet 중간 inline): `- 시스템은 카드를 **[MUST]** 먼저 표시한다`

    grep·CI 추출이 깨지는 drift 패턴입니다. Stage 2 Branch B/C로 돌아가 해당 줄을 bullet head 형태로 재작성해주세요.

  prd.stage3.vague_word_warning: |
    본문에 모호한 표현이 감지되었습니다: "{word}"
    위치: {line}

    이런 표현(예: "적절히", "자연스럽게", "충분히", "가능한", "합리적")은 구현자가 임의 해석하게 만들어 drift를 유발합니다. 구체 값(숫자·타임아웃·threshold·UI spec)으로 대체하거나, 의도가 맥락상 분명하다면 사용자에게 확인 후 남길 수 있습니다.

    Stage 2 Branch B/C로 돌아가 해당 문장을 재작성해주세요.

  # ==========================================================================
  # adr skill
  # ==========================================================================

  adr.stage1.intent_question: "무엇을 결정하려고 하세요? 한두 문장으로 설명해주세요."

  adr.stage1.scope_question: |
    이 결정의 범위가 어떻게 되나요?
    (1) 특정 도메인의 pitch에 종속 (도메인 이름 지정)
    (2) 여러 도메인/기능에 걸친 전역 결정 (`_global`)

  adr.consequences.positive_heading: "긍정적 영향"
  adr.consequences.negative_heading: "부정적 영향 / 트레이드오프"
  adr.consequences.cost_of_adoption_heading: "채택 비용 / 중립"

  adr.stage6.missing_required_section: |
    파일 생성을 중단합니다. 프로파일이 요구하는 필수 섹션이 본문에 누락되었습니다.

    누락:
    {missing_headings}

    Stage 3 인터뷰로 돌아가 해당 섹션을 채운 뒤 Stage 6를 재진행해주세요.

  # ==========================================================================
  # migrate skill  (v0.5 / S4)
  # ==========================================================================

  migrate.stage1.not_initialized: |
    현재 디렉토리와 상위 경로에서 `.immutable-prd/config.yml`을 찾지 못했습니다.

    `/immutable:migrate`는 이미 초기화된 immutable SDD 레포에서만 실행합니다. 새 레포를 시작한다면 먼저 `/immutable:init`을 실행해주세요.

    작업을 중단합니다.

  migrate.stage1.already_v3: |
    이미 config schema v{current_version}로 마이그레이션되어 있습니다 ({config_path}).

    `/immutable:migrate`는 `version: 2` → `version: 3` 전환 전용입니다. 추가 작업은 필요하지 않습니다.

    참고:
    - repo-local profile 편집이 필요하면 `.immutable-prd/profile.yml` 파일을 직접 수정하세요.
    - profile을 새로 도입하려면 `cp ${CLAUDE_PLUGIN_ROOT}/examples/_profiles/default-<lang>.yml .immutable-prd/profile.yml` 후 config.yml의 `profile:` 라인 주석 해제.

    작업을 중단합니다.

  migrate.stage2.plan_preview: |
    다음 변경을 수행합니다:

    1. config schema 버전 업그레이드: {current_version} → {target_version}
    2. bundled profile 복사: {profile_source_path} → {profile_dest_path}
    3. config.yml의 `# profile: ...` 주석 해제 → `profile: .immutable-prd/profile.yml`

    Preconditions:
    - 작업은 idempotent합니다 (이미 v3이거나 profile.yml이 존재하면 안전하게 skip).
    - git 명령은 실행하지 않습니다 — 변경 검토 후 직접 커밋해주세요.

    진행할까요? (yes / no)

  migrate.stage2.user_declined: |
    마이그레이션을 취소했습니다. 파일 변경 없음.

    작업을 중단합니다.

  migrate.stage3.profile_exists_warning: |
    {profile_dest_path}가 이미 존재합니다. 기존 파일을 보존하고 복사를 건너뜁니다. config.yml의 version bump + `profile:` 활성화는 그대로 진행합니다.

  migrate.stage4.handoff: |
    마이그레이션 완료:
    - {config_path}: version 3으로 업그레이드, `profile:` 라인 활성화
    - {profile_path}: repo-local profile 준비됨 (편집 가능)

    다음 단계:

    ```bash
    git add .immutable-prd/config.yml .immutable-prd/profile.yml
    git commit -m "chore(immutable): migrate config v2 → v3"
    ```

    참고:
    - profile.yml의 sections / personas / gate / naming 필드를 자유롭게 편집하세요.
    - 편집하지 않은 필드는 bundled default로 fallback됩니다.
    - 문제 발생 시 `git restore .immutable-prd/config.yml` + `rm .immutable-prd/profile.yml`로 롤백.

