# immutable plugin config (v0.5 — config schema v3).
#
# This starter bootstraps a Korean-language app repo (ADRs only).
# Pitches live in a sibling spec repo referenced by `spec_repo_path`.
#
# To customize behavior beyond language/paths, copy a profile from
# `immutable/examples/_profiles/` into this repo and point `profile:` at it
# (commented example below). Missing fields fall back to the default
# profile matching `team_language`.

# Config schema version.
#   2 — v0.3 / v0.4 layout, hardcoded defaults (auto-upgraded in v0.5+)
#   3 — v0.5+ layout, optional `profile:` field
version: 3

# Repository mode for THIS repo.
#   two-repo-spec: this is the spec repo (pitches only)
#   two-repo-app:  this is the app repo (ADRs only)
#   single-repo:   both pitches and ADRs live here
repo_mode: two-repo-app

# Team working language for user-facing prompts.
team_language: ko

# Path to ADRs in this app repo.
adr_path: adr/

# Sibling spec repo (where pitches live).
# Can be absolute or relative to this repo's root. /immutable:adr resolves
# pitch filenames against <spec_repo_path>/<pitches_path_in_spec>.
# Set to null to skip pitch existence validation (referenced filenames
# remain free-form strings).
#
# REPLACE the placeholder below with your actual spec repo path.
spec_repo_path: ../<your-spec-repo>
pitches_path_in_spec: pitches/

# Template overrides (optional — defaults shown).
templates:
  adr: adr/TEMPLATE.md

# Profile selection (optional in v0.5).
#
# Unset → the plugin selects the default profile matching `team_language`
# (default-ko / default-en / etc. — bundled with the plugin).
#
# Set to a path (absolute or repo-relative) for a team-specific override.
# profile: .immutable-prd/profile.yml
