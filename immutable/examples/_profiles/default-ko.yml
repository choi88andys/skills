# default-ko.yml — Korean default profile for /immutable:prd authoring.
#
# A profile is a declarative bundle of tunables: section headings, adversarial
# personas, 90% gate thresholds, identifier regex, filename conventions.
# Skills read this file to render prompts, validate answers, and assemble the
# final pitch. Teams override selected fields via their own `profile.yml`;
# missing fields fall back to the default profile referenced in config.yml.
#
# This file reflects the hardcoded defaults baked into the v0.4 /immutable:prd
# skill (Korean working language). Reorganized as data so v0.5+ skills can
# consume it at runtime instead of embedding the Korean prompts inline.
#
# NOTE: User-facing strings live inline in this profile for v0.5 simplicity.
# v0.6+ may delegate fully to `strings/strings.<locale>.yml` (see S3 roadmap).

# Schema revision of this profile file.
# Bumped on breaking changes to the profile keys below.
# v1 → v2 (v0.5.6): added `sections[].max_items`, top-level `anti_monolith` block,
# `adr.anti_monolith` block, new gate criterion `concern_scope`. v1 profiles auto-
# fallback (anti-monolith thresholds derived from `sections[user_stories].max_items`).
profile_schema: 2

# Team working language key. Must match `strings/strings.<locale>.yml` when
# strings catalog lookup is enabled. v0.5 renders inline strings from this file.
locale: ko

# Identifier shown in skill prompts ("default-ko profile"). User-facing.
display_name: "한국어 기본 프로필"

# -----------------------------------------------------------------------------
# Pitch body sections.
#   id         — stable snake_case English, referenced by skill logic.
#   heading    — user-facing section heading rendered into the pitch file.
#   required   — whether the section is mandatory. `false` = conditional.
#   min_items  — minimum blocks/rows for the 90% gate to consider this section complete.
#   structure  — (v0.5.3+, `user_stories` only) how acceptance criteria attach to stories.
#                `per_story_grouped` (default): each story sits in its own `### `
#                  sub-section with a Given/When/Then triple + ≥1 bracketed normative
#                  keyword line bound to that story. Preserves story↔criterion
#                  traceability and makes the body grep-friendly.
#                `consolidated`: a single GWT list + a single bracketed-keyword list
#                  under the H2. Compatible with v0.5.2 output. Story↔criterion binding
#                  is lost — use only if the domain has few stories and the binding
#                  cost outweighs traceability.
#                Enforced at Stage 2 Branch B completion, Stage 6 pre-write guard,
#                and `validate_docs.py --strict-body` (all three activate only when
#                the value is `per_story_grouped`).
#   description — hint shown during interview; also used as gate pass condition.
# Order of entries = order of Stage 2 branches + final file layout.
# -----------------------------------------------------------------------------
sections:
  - id: background
    heading: "배경과 문제"
    required: true
    min_items: 1
    description: "제3자가 3줄 이내로 '왜 필요한지'를 요약할 수 있어야 한다."
  - id: user_stories
    heading: "사용자 스토리 및 수용 조건"
    required: true
    min_items: 1
    # v0.5.6: max_items added as anti-monolith hard cap (`### ` sub-section count
    # under user_stories H2). 1 PRD = 1 feature/policy. 4-step linear flows
    # (e.g., 결제 흐름) may legitimately need 4 — bump to 4 in your team profile
    # if those are common. Above 5, the bundling is almost always 2 features
    # disguised as 1.
    max_items: 3
    structure: per_story_grouped
    description: "Given/When/Then 블록 — happy path + alternate/error 최소 1개씩 (각 종류 ≥1, 총 합으로 ≥2개). 단일-feature PRD는 1 sub-section + 다중 MUST로도 정상. 기본 구조(per_story_grouped)에선 각 스토리를 `### ` 서브섹션으로 묶고 서브섹션 내부에 GWT + 결합 normative 줄을 함께 둔다. sub-section 개수가 max_items를 초과하면 anti_monolith 트리거."
  - id: edge_cases
    heading: "엣지 케이스"
    required: true
    min_items: 1
    description: "명시적 처리(expected behavior)가 적힌 행 ≥1개. 단일-feature PRD는 1행도 정상 (예: 단순 toggle은 'off 상태에서 동작 안 함' 한 줄)."
  - id: no_gos
    heading: "범위 제외 (No-gos)"
    required: true
    min_items: 1
    description: "deferred / intentionally-not-provided / outside-scope 중 하나로 분류된 항목 ≥1개."
  - id: feature_flag
    heading: "Feature Flag"
    required: false
    min_items: 0
    description: "플래그 사용 시에만 섹션 추가. Key + 상태 + 초기 상태 + fallback UX 4요소."

# -----------------------------------------------------------------------------
# Adversarial review personas (Stage 4).
# Each persona MUST surface ≥1 gap. "Looks good" is prohibited.
# Gaps raised by 2+ personas are promoted one severity level.
# -----------------------------------------------------------------------------
personas:
  - id: new_engineer
    name: "신입 개발자"
    question: "이 문서만 보고 pitch를 구현할 수 있는가?"
    checks:
      - "모호한 지시어 ('적절히', '보기 좋게', '자연스럽게')"
      - "GWT 블록이 구현 가능한 수준으로 구체적인가"
      - "다른 도메인에 대한 드러나지 않은 의존성"
  - id: customer_support
    name: "고객지원"
    question: "사용자가 각 엣지 케이스에서 무엇을 보는가?"
    checks:
      - "네트워크 / 권한 / 외부 의존 실패 모드 커버"
      - "에러 메시지 문구 정의 또는 명시적 no-go 배치"
      - "과도한 hand-wave 표현 ('라이브러리 기본 동작에 위임') 사용 여부"
  - id: product_lead
    name: "제품 책임자"
    question: "이 pitch가 Feature 규모에 맞는가?"
    checks:
      - "단일 플래그로 on/off 가능한가"
      - "2~6주 내 완결 가능한가"
      - "Epic 규모 콘텐츠가 섞여있지 않은가 — sub-section ≥4면 anti_monolith.L1 hint 자동 발생, ≥5면 strong recommend, ≥8(또는 anti_monolith.L3.sub_sections)이면 update intent 차단"
      - "기존 active pitch와 겹침/충돌 여부 (도메인당 multiple actives는 정상이나, 같은 scope를 중복 명세하지는 않는지)"
  - id: quality_auditor
    name: "품질 감수자"
    question: "이 pitch가 정량 기준으로 구현·검증 가능한가? 주관적 판단을 요구하는 문장은 없는가?"
    checks:
      - "각 normative 줄에 정량 기준(숫자·타임아웃·threshold·UI spec) 포함 여부"
      - "'적절히', '자연스럽게', '충분히', '합리적' 같은 모호어 잔존 여부 (Stage 3 regex를 통과했더라도 맥락상 모호한 경우 포함)"
      - "각 GWT의 Then이 pass/fail 판정 가능한가, 아니면 주관적 판단 요구"
      - "주어 생략·passive voice로 책임 주체가 불분명한 문장 유무 (예: '처리된다', '보여진다')"
      - "Stage 1.5 intake의 일부만 다루는 PRD라면 나머지 부분은 별도 PRD로 분할되었거나 분할 예정인지 확인 (intake 1:1 매핑 가정 폐기 — 1 도메인의 intake가 N개 PRD로 자연 분해됨)"
      - "sub-section 간 normative 분포 imbalance — 한 sub-section에 normative가 7개 이상 몰려있고 다른 sub-section은 1-2개라면, 그 sub-section 자체가 별도 feature일 가능성 (split 권장)"

# -----------------------------------------------------------------------------
# RFC 2119 normative keywords used inside pitch body.
# Bracket syntax `[KEYWORD]` — multi-word keys use `token` for rendering.
# -----------------------------------------------------------------------------
normative_keywords:
  - key: MUST
    token: "MUST"
    meaning: "반드시 해야 함 (예외 없음)"
  - key: MUST_NOT
    token: "MUST NOT"
    meaning: "절대 해서는 안 됨"
  - key: SHOULD
    token: "SHOULD"
    meaning: "가능하면 해야 함. 정당한 이유가 있으면 예외 허용"
  - key: SHOULD_NOT
    token: "SHOULD NOT"
    meaning: "가능하면 하지 말아야 함"
  - key: MAY
    token: "MAY"
    meaning: "해도 되고 안 해도 됨 (선택)"

# -----------------------------------------------------------------------------
# 90% completeness gate (Stage 5).
#   total               — number of criteria below.
#   pass_threshold      — minimum pass count to allow file generation.
#   reject_on_unresolved — any `[미확정]` tag blocks regardless of pass count.
# -----------------------------------------------------------------------------
gate:
  total: 8
  pass_threshold: 7
  reject_on_unresolved: true
  unresolved_tag: "[미확정]"
  criteria:
    - id: background_clear
      label: "배경 명확"
      pass_condition: "제3자가 3줄 이내로 의도를 요약할 수 있고 [미확정] 태그가 남아있지 않다"
    - id: gwt_minimum
      label: "GWT 2종류 이상 (happy + alternate)"
      pass_condition: "happy path GWT ≥1 AND alternate/error GWT ≥1 (총 합 ≥2). 종류 검사이지 갯수 검사 아님 — 단일 happy path만 있는 PRD는 fail"
    - id: normative_minimum
      label: "Normative 3개 이상"
      pass_condition: "본문에 대괄호 키워드 구문이 3개 이상 — feature 명세 깊이의 핵심 신호. PRD가 작아도 이 floor는 유지"
    - id: edge_cases_minimum
      label: "엣지 케이스 1행 이상"
      pass_condition: "명시적 처리가 적힌 행이 1개 이상 (단일-feature PRD는 1행으로 충분)"
    - id: no_gos_minimum
      label: "No-go 1개 이상"
      pass_condition: "분류된 범위 제외 항목이 1개 이상 — 모든 PRD의 self-scope 명시는 필수"
    - id: no_code_identifiers
      label: "코드 식별자 0개"
      pass_condition: "Stage 3 식별자 스캔을 통과"
    - id: feature_scope
      label: "Feature 규모"
      pass_condition: "단일 플래그 토글 테스트 통과 + 2~6주 완결 가능"
    - id: concern_scope
      label: "단일 관심사 scope (anti-monolith)"
      pass_condition: "user_stories sub-section 수 ≤ sections[user_stories].max_items AND total normative ≤ anti_monolith.L3.normative_lines. anti_monolith.L1/L2 임계 초과 시 본 criterion은 통과하되 hint/strong-recommend가 표시됨; L3 초과 시 fail (block)."

# -----------------------------------------------------------------------------
# Code identifier detection patterns (Stage 3).
# Hit in pitch body → return to Stage 2 for the relevant branch.
# Regex evaluated with standard PCRE semantics.
# -----------------------------------------------------------------------------
identifier_patterns:
  - id: camelCase
    regex: '\b[a-z][a-zA-Z0-9]*[A-Z][a-zA-Z0-9]*\b'
    hint: "camelCase 식별자 (변수·함수·메서드 추정)"
  - id: snake_case
    regex: '\b[a-z]+_[a-z_]+\b'
    hint: "snake_case 식별자 (파이썬/파일명 추정)"
  - id: PascalCase
    regex: '\b[A-Z][a-z]+[A-Z][a-zA-Z]*\b'
    hint: "PascalCase 식별자 (클래스·타입 추정)"
  - id: file_path
    regex: '\b[a-z]+/[a-z_/]+\.(dart|swift|ts|js|py|kt)\b'
    hint: "코드 파일 경로"

# -----------------------------------------------------------------------------
# Vague-word detection (Stage 3, v0.5.3+).
# Hedge words that let implementers fill the gap arbitrarily and cause drift.
# On hit: Stage 3 warns via prd.stage3.vague_word_warning and loops back to
# Branch B/C. Teams override this list by forking the profile.
# -----------------------------------------------------------------------------
vague_words:
  - id: jeokjeolhi
    regex: '적절(히|하게|한)'
    hint: "'적절히/적절한' — 기준을 구체 값으로 대체하거나 맥락 확인"
  - id: jayeonseureopge
    regex: '자연스(럽게|러운|러움)'
    hint: "'자연스럽게' — 기대 동작을 구체 transition/timing으로 대체"
  - id: chungbunhi
    regex: '충분(히|한)'
    hint: "'충분히/충분한' — 수량·시간 기준을 구체 숫자로 대체"
  - id: ganeunghan
    regex: '가능(한 한|한)\s*(빠르게|적극|신속)?'
    hint: "'가능한 한 ~' — 정량 기준(예: 2초 내) 또는 baseline 설정"
  - id: haprijeok
    regex: '합리(적|적으로)'
    hint: "'합리적으로' — 판단 기준을 명시해 주관 판단 제거"
  - id: ilbanjeok
    regex: '일반(적으로|적인)'
    hint: "'일반적으로' — 표준/default를 구체 값으로 명시"
  - id: choidaehan
    regex: '최대한'
    hint: "'최대한' — 상한/cap을 수치로 정의"
  - id: pilyoeddara
    regex: '필요에\s*따라'
    hint: "'필요에 따라' — 트리거 조건을 구체적으로 기술"
  - id: sanghwangmatgye
    regex: '상황에\s*맞게'
    hint: "'상황에 맞게' — 분기 조건을 나열"
  - id: anjeonhage
    regex: '안전하(게|도록)'
    hint: "'안전하게' — 위협 모델과 보장 조건을 구체적으로 기술"
  - id: budeureopge
    regex: '부드럽게'
    hint: "'부드럽게' — 애니메이션 duration·easing 등 정량 기준 명시"

# -----------------------------------------------------------------------------
# Naming conventions (pitch files).
# -----------------------------------------------------------------------------
naming:
  filename_pattern: '^\d{4}-\d{2}-\d{2}-[a-z0-9][a-z0-9-]*\.md$'
  date_format: "%Y-%m-%d"
  slug_case: kebab
  slug_language: en
  forbidden_slug_patterns:
    - id: delta_describing
      regex: '^(figma-alignment|policy-update|code-aligned|v\d)'
      reason: "delta-describing slug — 주제가 아닌 변경 내역을 담음"
    - id: timeliness
      regex: '^(latest|final|current)(-|$)'
      reason: "시점성 표현 — 매 새 버전마다 의미가 바뀜"

# -----------------------------------------------------------------------------
# Feature flag conventions (Branch F).
# -----------------------------------------------------------------------------
feature_flag:
  key_prefix: "ff_"
  states:
    - deployed
    - hidden
  default_initial: hidden
  required_fields:
    - key
    - states
    - initial_state
    - fallback_ux

# -----------------------------------------------------------------------------
# Anti-monolith escalation (v0.5.6 / profile_schema 2).
#
# Detects oversized PRDs (multiple features bundled into one). 3 severity tiers
# trigger increasingly strong skill behavior:
#
#   hint             — 한 줄 안내. 진행 무차단.
#   strong_recommend — split 옵션을 default로 표시. no-split 선택 시 reason 기록.
#   block            — `update` intent 차단. `refactor-split` / `split-from` /
#                      `new` (별도 작은 PRD) 만 허용.
#
# Each tier checks 2 metrics (OR semantics — 어느 한쪽이라도 초과하면 트리거):
#   sub_sections     — `### ` 헤더 카운트 (user_stories H2 슬라이스 내)
#   normative_lines  — bracketed keyword (`[MUST]`, `[MUST NOT]`, …) 라인 수 (전체 본문)
#
# Fallback: 본 블록을 생략(또는 enabled: false)하면 sections[user_stories].max_items
# 에서 자동 도출 — L1.sub_sections = max_items + 1, L2.sub_sections = max_items + 2,
# L3.sub_sections = max_items × 3, normative_lines = sub_sections × 5 (feature당
# 평균 normative 가정).
#
# Skill 연동 지점:
#   1. /immutable:prd Stage 1.2 environment scan — 도메인의 active PRD들에 대해
#      metric 계산 → tier 분류 → pre-check 메시지 표시
#   2. Stage 1.3 intent 분류 — `update` intent가 L2/L3 PRD를 타겟하면 자동으로
#      split 옵션 우선 / 차단
#   3. Stage 5 gate `concern_scope` criterion — 작성 중 draft가 L3 초과 시 fail
# -----------------------------------------------------------------------------
anti_monolith:
  enabled: true
  tiers:
    L1:
      action: hint
      sub_sections: 4
      normative_lines: 20
    L2:
      action: strong_recommend
      sub_sections: 5
      normative_lines: 25
    L3:
      action: block
      sub_sections: 8
      normative_lines: 40

# -----------------------------------------------------------------------------
# Domain allowlist policy.
# -----------------------------------------------------------------------------
domain_allowlist:
  source: "pitches/README.md"
  reserved_domains:
    - id: "_shared"
      description: "특정 도메인에 속하지 않는 공통 관심사 (인증·로깅·에러 처리 등)"
    - id: "_global"
      description: "ADR 전용 — 도메인 경계를 넘는 아키텍처 결정"
      adr_only: true
  new_domain_review:
    near_duplicate_threshold: 2    # Levenshtein distance
    requires_lead_approval: true

# -----------------------------------------------------------------------------
# ADR-specific overrides (added v0.5 / S2).
#
# Pitch fields above (sections, personas, gate, feature_flag) only apply to
# /immutable:prd. ADR has its own body shape, persona set, and 6-criterion
# gate — captured below so /immutable:adr can lookup section headings and
# completeness criteria from the profile instead of hardcoding them.
#
# v0.5 scope: /immutable:adr consumes `adr.sections[].heading` for body
# assembly only. `adr.personas` and `adr.gate` are populated for S3+ use
# (skill text still references them inline for v0.5 simplicity).
# -----------------------------------------------------------------------------
adr:
  sections:
    - id: context
      heading: "맥락 (Context)"
      required: true
      min_items: 1
      description: "제3자가 3줄 이내로 '무엇이 이 결정을 촉발했는지' 요약 가능."
    - id: decision
      heading: "결정 (Decision)"
      required: true
      min_items: 1
      description: "맥락 없이 읽어도 의미가 통하는 단일 선언문 1개."
    - id: consequences
      heading: "결과 (Consequences)"
      required: true
      min_items: 4
      description: "긍정적 영향 ≥2 AND 부정적 영향 / 트레이드오프 ≥2 명시. 채택 비용은 선택."
    - id: alternatives
      heading: "검토한 대안 (Alternatives Considered)"
      required: true
      min_items: 2
      description: "기각 사유 + 재검토 조건이 적힌 대안 ≥2개."
    - id: revisit_triggers
      heading: "재검토 조건 (Revisit Triggers)"
      required: true
      min_items: 1
      description: "metric / milestone / 예정된 리뷰 일자 중 ≥1."
    - id: scope_exclusions
      heading: "범위 제외"
      required: false
      min_items: 0
      description: "해당 ADR이 명시적으로 결정하지 않는 항목. 선택 섹션."

  personas:
    - id: new_engineer
      name: "신입 개발자 (다음 분기 합류)"
      question: "이 결정을 이 문서만 보고 일관되게 적용할 수 있는가?"
      checks:
        - "모호한 결정 진술 ('적절한 방향으로')"
        - "롤백 또는 escape hatch 누락"
        - "전제조건 (도구·인프라·SDK 버전 등) 미기재"
    - id: maintainer
      name: "유지관리자 (2년 후 인수)"
      question: "이 코드베이스를 물려받았을 때 이 결정이 여전히 유효한지 알 수 있는가?"
      checks:
        - "재검토 조건 부재 — '결정한 뒤 다시 보지 않음'"
        - "조용히 거짓이 될 미기재 가정"
        - "결정을 정당화한 pitch 링크 누락"
    - id: product_lead
      name: "제품 책임자"
      question: "이 결정이 참조 pitch들의 product promise를 존중하는가?"
      checks:
        - "참조된 pitch의 [MUST] 요구를 조용히 무력화하는 트레이드오프"
        - "scope creep — ADR이 선언한 것보다 더 많이 결정"
        - "진행 중 feature와 명확히 연결되지 않은 누락 링크"

  gate:
    total: 6
    pass_threshold: 5
    reject_on_unresolved: true
    unresolved_tag: "[미확정]"
    criteria:
      - id: context_clear
        label: "맥락 명확"
        pass_condition: "제3자가 3줄 이내로 트리거를 요약 가능, [미확정] 잔존 없음"
      - id: decision_singular
        label: "단일 선언문"
        pass_condition: "단일 선언문 1개 (헤지 단락 아님)"
      - id: consequences_balanced
        label: "결과 균형"
        pass_condition: "긍정적 ≥2 AND 부정적 ≥2 명시"
      - id: alternatives_considered
        label: "대안 검토"
        pass_condition: "기각 사유 적힌 대안 ≥2개"
      - id: revisit_trigger_present
        label: "재검토 조건"
        pass_condition: "metric / milestone / 리뷰 일자 ≥1"
      - id: references_valid
        label: "참조 유효"
        pass_condition: "references.pitches 비어있지 않음 (또는 _global), 모든 참조 파일 존재"

  # ---------------------------------------------------------------------------
  # ADR anti-monolith (v0.5.6 / profile_schema 2).
  #
  # ADRs bundle decisions less often than pitches bundle features (ADR has
  # 단일 선언문 gate criterion이 이미 강제). 임계는 pitch보다 느슨함. 주된 효과는
  # /immutable:adr Stage 5에서 한 ADR이 여러 결정을 묶고 있는지 sanity check.
  #
  # Metrics:
  #   alternatives_count    — `## 검토한 대안` 섹션 내 항목 수 (10개 넘으면 의심)
  #   consequences_count    — `## 결과` 섹션 내 positive + negative + cost 총 라인 수
  # ---------------------------------------------------------------------------
  anti_monolith:
    enabled: true
    tiers:
      L1:
        action: hint
        alternatives_count: 6
        consequences_count: 12
      L2:
        action: strong_recommend
        alternatives_count: 8
        consequences_count: 18
      L3:
        action: block
        alternatives_count: 12
        consequences_count: 30
