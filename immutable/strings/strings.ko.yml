  prc.refuse.spec_only_repo: |
    이 디렉토리는 spec-only 레포 (`repo_mode: two-repo-spec`) 입니다.

    plan-review 는 implementation repo 에서 호출하는 스킬입니다. 옵션:
    - (A) Implementation repo 로 이동 후 다시 호출
    - (B) spec repo 작업이 의도였다면 `/immutable:prd` 가 맞는 도구

    작업을 중단합니다.

  prc.refuse.no_pitch: |
    리뷰 대상 pitch 를 찾지 못했습니다.

    옵션:
    - (A) `/immutable:prd` 로 새 pitch 작성 후 다시 호출
    - (B) Refactor 모드로 진행하려면 먼저 `/immutable:design` 을 호출해서
      "refactor" 모드로 transient 노트를 만들고 돌아오세요
    - (C) 작업 중단

  prc.warn.no_design_note: |
    ⚠ Design handoff note 미존재 — `{expected_path}`.

    이 노트는 `/immutable:design` 이 작성하는 app-side context (module
    placement, activation status, dependent features) 입니다. CEO 리뷰의
    grounding 입력이며, 없으면 11 sections 리뷰가 **degraded mode** 로 동작합니다
    — 코드베이스 hidden path / 모듈 boundary / 의존 기능을 모르고 진행하므로
    Section 1·9·10 의 architecture/rollout 판단력이 약해집니다.

    선택 (silent-skip 은 허용되지 않음):

    - (A) **일시정지하고 `/immutable:design <slug>` 먼저 실행** (권장)
        디자인 노트 작성 후 본 skill 을 다시 invoke. App-side context 가
        깔끔하게 grounded 된 상태에서 11 sections 리뷰가 정상 모드로 동작.

    - (B) Degraded mode 로 진행
