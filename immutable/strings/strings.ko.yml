    옵션:
    - (A) `/immutable:prd` 로 새 pitch 작성 후 다시 호출
    - (B) Refactor 모드로 진행 — pitch 없이 구현 (내부 작업, infra 변경 등)
    - (C) 작업 중단

  design.step1.refactor_mode_acknowledged: |
    Refactor 모드 — pitch 없이 진행. 이 transient 노트는 plan-review-ceo 가 읽되
    pitch-grounded 질문은 건너뜁니다.

  design.step3.activation_question: |
    Activation 정보를 확인하겠습니다 (pitch 의 Open UX questions 섹션이 비어있다면 답변 필수):

    1. 어느 버전 / 언제부터 end user 에게 노출됩니까?
    2. 출시 전 어떤 hidden path 또는 feature flag 로 접근 가능합니까? (정확한 식별자)
    3. Live 전환 조건은 무엇입니까? (metric / approval / 일정)

  design.step3.dependencies_question: |
    Dependent features:

    1. 같은 데이터 / 화면 / 서비스를 사용하는 다른 feature 가 있습니까?
    2. 그 중 다른 브랜치에서 개발 중인 것이 있습니까?
    3. 이 작업이 다른 feature 의 ship 일정을 막거나 / 막힙니까?

  design.step3.module_question: |
    Module 배치:

    1. 어느 module / package 가 이 작업을 소유합니까? (구체적: `lib/cart/` 식)
    2. Pitch 가 surface 하지 않는 cross-module 의존성이 있습니까?
    3. 새 module 을 만들어야 합니까? 그렇다면 boundary contract 는?

  design.step4.note_written: |
    Design handoff note 작성 완료: `{path}`

    이 노트는 다음 단계 (`/immutable:plan-review-ceo`) 가 pitch + ADRs 외에 추가로
    참조하는 transient context 입니다. .claude/immutable/ 네임스페이스라 git 에는
    커밋되지 않습니다.

  design.step4.handoff_to_plan_review_ceo: |
