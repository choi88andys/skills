  # ==========================================================================
  # migrate skill  (v0.5 / S4)
  # ==========================================================================

  migrate.stage1.not_initialized: |
    현재 디렉토리와 상위 경로에서 `.immutable-prd/config.yml`을 찾지 못했습니다.

    `/immutable:migrate`는 이미 초기화된 immutable SDD 레포에서만 실행합니다. 새 레포를 시작한다면 먼저 `/immutable:init`을 실행해주세요.

    작업을 중단합니다.

  # v0.5.6 alias — backward-compat for callers wired to old key. Renders fully_current.
  migrate.stage1.already_v3: |
    config schema v{current_version} 상태입니다 ({config_path}).

    참고: v0.5.7부터 `/immutable:migrate`가 profile 필드 마이그레이션도 담당합니다. 본 메시지는 v0.5.6 호환용 alias이며, profile_schema 상태를 별도로 확인해주세요.

  migrate.stage1.fully_current: |
    이미 최신 상태입니다:
    - config: v{current_version} ({config_path})
    - profile: schema v{profile_schema} ({profile_path})

    추가 작업이 필요하지 않습니다. `/immutable:migrate`는 idempotent — 다시 실행해도 안전합니다.

    profile 필드 편집은 직접 `.immutable-prd/profile.yml`을 수정하세요. 편집하지 않은 필드는 bundled default로 fallback됩니다.

    작업을 중단합니다.

  migrate.stage1.profile_missing: |
    config는 v3이지만 team profile 파일이 없습니다 ({profile_dest_path}).

    누군가 profile.yml을 지웠거나, config.yml의 `profile:` 라인을 다른 경로로 변경했을 가능성. 다음 중 하나로 복구:

    ```bash
    cp ${CLAUDE_PLUGIN_ROOT}/examples/_profiles/default-{team_language}.yml {profile_dest_path}
    ```

    또는 `/immutable:init`을 다시 실행 (기존 파일 보존).

    작업을 중단합니다.

  migrate.stage1.profile_ahead_of_plugin: |
    team profile schema (v{team_profile_schema})가 bundled default schema (v{bundled_profile_schema})보다 앞서 있습니다.

    plugin이 다운그레이드되었거나, 다른 환경에서 더 새 버전으로 마이그레이션한 profile을 가져왔을 가능성. plugin을 최신으로 업데이트한 뒤 다시 실행해주세요:

    ```bash
    claude plugin install immutable@latest
    ```

    작업을 중단합니다.

  # v0.5.6 alias — kept for backward-compat. New routing-aware templates below.
  migrate.stage2.plan_preview: |
    다음 변경을 수행합니다:

    1. config schema 버전 업그레이드: {current_version} → {target_version}
    2. bundled profile 복사: {profile_source_path} → {profile_dest_path}
    3. config.yml의 `# profile: ...` 주석 해제 → `profile: .immutable-prd/profile.yml`

    Preconditions:
    - 작업은 idempotent합니다 (이미 v3이거나 profile.yml이 존재하면 안전하게 skip).
    - git 명령은 실행하지 않습니다 — 변경 검토 후 직접 커밋해주세요.

    진행할까요? (yes / no)

  migrate.stage2.plan_preview_full: |
    다음 변경을 수행합니다 (config v{current_version}→v{target_version} + profile schema 마이그레이션):

    [Config 마이그레이션]
    1. config schema 버전 업그레이드: v{current_version} → v{target_version}
    2. bundled profile 복사 (없는 경우): {profile_source_path} → {profile_dest_path}
    3. config.yml의 `# profile: ...` 주석 해제 → `profile: .immutable-prd/profile.yml`

    [Profile field 마이그레이션 — team profile schema v{team_profile_schema} → v{bundled_profile_schema}]
    {profile_field_diff}

    Preconditions:
    - 작업은 idempotent — 이미 적용된 변경은 안전하게 skip됩니다.
    - 기존 profile 값은 변경하지 않습니다 (override 보존). 누락된 필드만 추가합니다.
    - git 명령은 실행하지 않습니다 — 변경 검토 후 직접 커밋해주세요.

    진행할까요? (yes / no)

  migrate.stage2.plan_preview_profile_only: |
    config는 이미 v3 상태입니다. profile schema만 마이그레이션합니다.

    [Profile field 마이그레이션 — team profile schema v{team_profile_schema} → v{bundled_profile_schema}]
    {profile_field_diff}

    Preconditions:
    - 기존 profile 값은 변경하지 않습니다 (override 보존). 누락된 필드만 추가합니다.
    - 작업은 idempotent — 이미 적용된 변경은 안전하게 skip됩니다.

    진행할까요? (yes / no)

  migrate.stage2.plan_preview_config_only: |
    config schema v{current_version} → v{target_version} 마이그레이션 (profile은 fresh copy 후 schema 검사 통과).

    1. bundled profile 복사: {profile_source_path} → {profile_dest_path}
    2. config schema 버전 업그레이드: v{current_version} → v{target_version}
    3. config.yml의 `# profile: ...` 주석 해제

    진행할까요? (yes / no)

  migrate.stage2.user_declined: |
    마이그레이션을 취소했습니다. 파일 변경 없음.

    작업을 중단합니다.

  migrate.stage3.profile_exists_warning: |
    {profile_dest_path}가 이미 존재합니다. 기존 파일을 보존하고 복사를 건너뜁니다. config.yml의 version bump + `profile:` 활성화는 그대로 진행합니다.

  migrate.stage4.handoff: |
    마이그레이션 완료:
    - {config_path}: version 3으로 업그레이드, `profile:` 라인 활성화
    - {profile_path}: repo-local profile 준비됨 (편집 가능)

    다음 단계:

    ```bash
    git add .immutable-prd/config.yml .immutable-prd/profile.yml
    git commit -m "chore(immutable): migrate config v2 → v3"
    ```

    참고:
    - profile.yml의 sections / personas / gate / naming 필드를 자유롭게 편집하세요.
    - 편집하지 않은 필드는 bundled default로 fallback됩니다.
    - 문제 발생 시 `git restore .immutable-prd/config.yml` + `rm .immutable-prd/profile.yml`로 롤백.

  # v0.5.7 — Stage 5 (profile field migration) and Stage 6 (final handoff)

  migrate.stage5.already_current: |
    team profile schema (v{team_profile_schema})가 이미 bundled default (v{bundled_profile_schema})와 일치합니다. profile 필드 마이그레이션 skip.

  migrate.stage5.field_added: "  + {field_path}: {description}"
  migrate.stage5.field_skipped_present: "  · {field_path}: 이미 존재 — skip (override 보존)"

  migrate.stage5.execute_progress: |
    profile field 마이그레이션 진행 중:
    {field_results}

    profile_schema bump: v{team_profile_schema} → v{bundled_profile_schema}

  migrate.stage5.edit_failure: |
    profile.yml 수정 실패: {field_path}

    skill이 expected text를 찾지 못했거나 unique하지 않습니다. 사용자가 profile을 reformat했거나 수동 편집했을 가능성. 다음 중 하나로 해결:

    1. 수동 merge: `${CLAUDE_PLUGIN_ROOT}/examples/_profiles/default-{team_language}.yml`에서 `{field_path}` 블록을 복사하여 team profile에 직접 추가.
    2. 전체 profile 교체 (override 손실 위험): `cp ${CLAUDE_PLUGIN_ROOT}/examples/_profiles/default-{team_language}.yml {profile_dest_path}` — 기존 customization 사라짐.

    Stage 5 중단합니다. 다른 stage 변경사항은 commit 안전 (Stage 5는 atomic하지 않음).

  migrate.stage5.verify_failure: |
    profile.yml 검증 실패: {assertion}

    파일이 예상 상태가 아닙니다. 롤백 권장:

    ```bash
    git restore .immutable-prd/profile.yml
    ```

    그리고 수동 점검 후 다시 `/immutable:migrate` 실행.

  migrate.stage6.handoff: |
    마이그레이션 완료:
    {stages_run}

    파일:
    - {config_path}
    - {profile_path}
    {post_migration_notes}

    다음 단계:

    ```bash
    {commit_suggestion}
    ```

    참고:
    - profile.yml의 sections / personas / gate / naming / anti_monolith 필드를 자유롭게 편집하세요.
    - 편집하지 않은 필드는 bundled default로 fallback됩니다.
    - 문제 발생 시 위 commit 메시지의 변경사항을 `git restore`로 되돌릴 수 있습니다.

  migrate.stage6.note_concern_scope_threshold: |
    NOTE: `concern_scope` gate criterion이 추가되었지만 `gate.total` / `gate.pass_threshold`는 자동 변경하지 않았습니다 (override 보존 원칙).
    이 criterion을 gate 통과 조건에 포함시키려면 직접 수정:

    ```yaml
    gate:
      total: 8           # was 7
      pass_threshold: 7  # was 6
    ```

