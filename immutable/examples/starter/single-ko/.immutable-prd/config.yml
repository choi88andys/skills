# immutable plugin config (v0.5 — config schema v3).
#
# This starter bootstraps a Korean-language single-repo (pitches + ADRs in
# the same repo). Pitches live in `spec/pitches/`; ADRs at the app repo root.
#
# Config lives at app repo root so the walk-up resolver finds it whether
# `/immutable:prd` is invoked from inside spec/ or `/immutable:adr` from
# alongside ADRs.
#
# To customize behavior beyond language/paths, copy a profile from
# `immutable/examples/_profiles/` into this repo and point `profile:` at it.

# Config schema version.
#   2 — v0.3 / v0.4 layout, hardcoded defaults (auto-upgraded in v0.5+)
#   3 — v0.5+ layout, optional `profile:` field
version: 3

# Repository mode for THIS repo.
#   two-repo-spec: this is the spec repo (pitches only)
#   two-repo-app:  this is the app repo (ADRs only)
#   single-repo:   both pitches and ADRs live here
repo_mode: single-repo

# Team working language for user-facing prompts.
team_language: ko

# Pitches in a subtree (separates from implementation).
pitches_path: spec/pitches/

# ADRs at the app repo root alongside code.
adr_path: adr/

# Template overrides (optional — defaults shown).
templates:
  pitch: spec/pitches/TEMPLATE.md
  adr: adr/TEMPLATE.md

# Profile selection (optional in v0.5).
# Unset → bundled default profile matching `team_language`.
# profile: .immutable-prd/profile.yml
