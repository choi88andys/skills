# default-en.yml — English default profile for /immutable:prd authoring.
#
# Mirrors default-ko.yml with English canonical section headings, personas,
# and prompts. Teams with English as their working language select this
# profile via `config.yml: profile: examples/_profiles/default-en.yml`
# (or by running `/immutable:init` and picking the en option).
#
# See default-ko.yml for per-field documentation; only values differ.

profile_schema: 1

locale: en

display_name: "English default profile"

# user_stories `structure` (v0.5.3+):
#   per_story_grouped (default) — each story lives in its own `### ` sub-section
#     with a Given/When/Then triple + ≥1 bracketed normative keyword line bound
#     to that story. Preserves story↔criterion traceability, keeps the body
#     grep-friendly. Enforced by Stage 2 Branch B completion, Stage 6 pre-write
#     guard, and `validate_docs.py --strict-body`.
#   consolidated — single GWT list + single normative list under the H2
#     (v0.5.2 shape). Traceability is lost; use only if the domain has few
#     stories and the binding cost outweighs traceability.
sections:
  - id: background
    heading: "Background and Problem"
    required: true
    min_items: 1
    description: "A third party can summarize intent in ≤3 lines."
  - id: user_stories
    heading: "User Stories and Acceptance Criteria"
    required: true
    min_items: 2
    structure: per_story_grouped
    description: "≥2 Given/When/Then blocks covering happy path + alternate/error. Under the default per_story_grouped structure, each story gets its own `### ` sub-section carrying the GWT triple + bound normative keyword lines."
  - id: edge_cases
    heading: "Edge Cases"
    required: true
    min_items: 2
    description: "≥2 rows with explicit handling (expected behavior)."
  - id: no_gos
    heading: "Out of Scope"
    required: true
    min_items: 1
    description: "≥1 item classified as deferred / intentionally-not-provided / outside-scope."
  - id: feature_flag
    heading: "Feature Flag"
    required: false
    min_items: 0
    description: "Only when used. Key + states + initial state + fallback UX."

personas:
  - id: new_engineer
    name: "New Engineer"
    question: "Could I implement this pitch with only this document?"
    checks:
      - "Vague directives (\"appropriately\", \"nicely\", \"naturally\")"
      - "GWT blocks concrete enough to implement"
      - "Unstated dependencies on other domains"
  - id: customer_support
    name: "Customer Support"
    question: "What does the user see in every edge case?"
    checks:
      - "Coverage of network / permission / external-dependency failure modes"
      - "Defined error messaging or explicit no-go placement"
      - "Excessive hand-wave phrases (\"delegated to library defaults\")"
  - id: product_lead
    name: "Product Lead"
    question: "Is this pitch at Feature scale?"
    checks:
      - "Single-flag toggleability"
      - "Completion within 2–6 weeks"
      - "Epic-level content that should be split"
      - "Overlap or conflict with existing active pitches"
  - id: quality_auditor
    name: "Quality Auditor"
    question: "Can this pitch be implemented and verified against measurable criteria, with no clauses requiring subjective judgment?"
    checks:
      - "Each normative line carries a concrete criterion (numbers, timeouts, thresholds, UI specs)"
      - "Vague hedge words (\"appropriate\", \"reasonable\", \"naturally\", \"sufficient\") — catches context-vague cases even if the Stage 3 regex was satisfied"
      - "Every Then is pass/fail decidable rather than demanding subjective judgment"
      - "Passive voice / missing subject that hides the responsible actor (e.g., \"is processed\", \"is shown\")"
      - "Depth appropriate to domain complexity — thin MUST/edge-case counts despite substantial Stage 1.5 intake is a drift signal"

normative_keywords:
  - key: MUST
    token: "MUST"
    meaning: "Required, no exceptions."
  - key: MUST_NOT
    token: "MUST NOT"
    meaning: "Forbidden."
  - key: SHOULD
    token: "SHOULD"
    meaning: "Recommended; justified exceptions allowed."
  - key: SHOULD_NOT
    token: "SHOULD NOT"
    meaning: "Discouraged."
  - key: MAY
    token: "MAY"
    meaning: "Optional."

gate:
  total: 7
  pass_threshold: 6
  reject_on_unresolved: true
  unresolved_tag: "[TBD]"
  criteria:
    - id: background_clear
      label: "Background clear"
      pass_condition: "Third party can summarize intent in ≤3 lines; no [TBD] tags remain."
    - id: gwt_minimum
      label: "≥2 GWT blocks"
      pass_condition: "≥2 structurally complete Given/When/Then blocks."
    - id: normative_minimum
      label: "≥3 normative statements"
      pass_condition: "≥3 bracketed normative statements across the body."
    - id: edge_cases_minimum
      label: "≥2 edge-case rows"
      pass_condition: "≥2 rows with explicit handling."
    - id: no_gos_minimum
      label: "≥1 no-go"
      pass_condition: "≥1 classified out-of-scope item."
    - id: no_code_identifiers
      label: "0 code identifiers"
      pass_condition: "Stage 3 identifier scan passes cleanly."
    - id: feature_scope
      label: "Feature-scale scope"
      pass_condition: "Single-flag toggle test passes; 2–6 week completability."

identifier_patterns:
  - id: camelCase
    regex: '\b[a-z][a-zA-Z0-9]*[A-Z][a-zA-Z0-9]*\b'
    hint: "camelCase identifier (likely variable/function/method)"
  - id: snake_case
    regex: '\b[a-z]+_[a-z_]+\b'
    hint: "snake_case identifier (likely Python or filename)"
  - id: PascalCase
    regex: '\b[A-Z][a-z]+[A-Z][a-zA-Z]*\b'
    hint: "PascalCase identifier (likely class/type)"
  - id: file_path
    regex: '\b[a-z]+/[a-z_/]+\.(dart|swift|ts|js|py|kt)\b'
    hint: "Source file path"

# Vague-word detection (Stage 3, v0.5.3+).
# Hedge words that let implementers fill the gap arbitrarily and cause drift.
# On hit: Stage 3 warns via prd.stage3.vague_word_warning and loops back to
# Branch B/C. Teams override this list by forking the profile.
vague_words:
  - id: appropriate
    regex: '\bappropriate(ly)?\b'
    hint: "'appropriate/appropriately' — replace with concrete criteria or confirm context"
  - id: reasonable
    regex: '\breasonabl[ey]\b'
    hint: "'reasonable/reasonably' — state the explicit judgment criterion"
  - id: naturally
    regex: '\bnatural(ly)?\b'
    hint: "'naturally' — replace with concrete transition/timing spec"
  - id: sufficient
    regex: '\bsufficient(ly)?\b'
    hint: "'sufficient/sufficiently' — replace with a numeric threshold"
  - id: as_needed
    regex: '\bas needed\b'
    hint: "'as needed' — enumerate the triggering conditions"
  - id: etcetera
    regex: '\betc\.?\b|\band so on\b'
    hint: "'etc.' / 'and so on' — enumerate the items or cap the set"
  - id: smoothly
    regex: '\bsmooth(ly)?\b'
    hint: "'smoothly' — specify duration/easing/frame budget"
  - id: safely
    regex: '\bsafe(ly)?\b'
    hint: "'safely' — state the threat model and the guaranteed invariant"
  - id: generally
    regex: '\bgeneral(ly)?\b'
    hint: "'generally' — specify the default and the exceptions"

naming:
  filename_pattern: '^\d{4}-\d{2}-\d{2}-[a-z0-9][a-z0-9-]*\.md$'
  date_format: "%Y-%m-%d"
  slug_case: kebab
  slug_language: en
  forbidden_slug_patterns:
    - id: delta_describing
      regex: '^(figma-alignment|policy-update|code-aligned|v\d)'
      reason: "delta-describing slug — captures the change, not the subject"
    - id: timeliness
      regex: '^(latest|final|current)(-|$)'
      reason: "timeliness-bound term — meaning drifts with every new version"

feature_flag:
  key_prefix: "ff_"
  states:
    - deployed
    - hidden
  default_initial: hidden
  required_fields:
    - key
    - states
    - initial_state
    - fallback_ux

domain_allowlist:
  source: "pitches/README.md"
  reserved_domains:
    - id: "_shared"
      description: "Cross-cutting concerns not scoped to a specific domain (auth, logging, error handling)."
    - id: "_global"
      description: "ADR-only — architectural decisions that cut across all domains."
      adr_only: true
  new_domain_review:
    near_duplicate_threshold: 2
    requires_lead_approval: true

# -----------------------------------------------------------------------------
# ADR-specific overrides (added v0.5 / S2). See default-ko.yml for full notes.
# -----------------------------------------------------------------------------
adr:
  sections:
    - id: context
      heading: "Context"
      required: true
      min_items: 1
      description: "A third party can summarize what triggered this decision in ≤3 sentences."
    - id: decision
      heading: "Decision"
      required: true
      min_items: 1
      description: "A single declarative sentence readable out of context."
    - id: consequences
      heading: "Consequences"
      required: true
      min_items: 4
      description: "≥2 positive AND ≥2 negative consequences explicitly listed. Cost-of-adoption optional."
    - id: alternatives
      heading: "Alternatives Considered"
      required: true
      min_items: 2
      description: "≥2 alternatives with rejection reason + revisit trigger."
    - id: revisit_triggers
      heading: "Revisit Triggers"
      required: true
      min_items: 1
      description: "≥1 metric, milestone, or scheduled review date."
    - id: scope_exclusions
      heading: "Out of Scope"
      required: false
      min_items: 0
      description: "Things this ADR explicitly does NOT decide. Optional section."

  personas:
    - id: new_engineer
      name: "New Engineer (onboarding next quarter)"
      question: "Can I understand this decision and apply it consistently from this document alone?"
      checks:
        - "Vague decision statements (\"appropriate direction\")"
        - "Missing rollback or escape hatch"
        - "Unstated prerequisites (tooling, infra, SDK version)"
    - id: maintainer
      name: "Maintainer (2 years from now)"
      question: "Will I know whether this decision still applies when I inherit this codebase?"
      checks:
        - "Absent revisit triggers — \"decide and never look back\""
        - "Undocumented assumptions that will silently become false"
        - "Missing link to the pitch(es) that justify the decision"
    - id: product_lead
      name: "Product Lead"
      question: "Does this decision respect the product promise in the referenced pitches?"
      checks:
        - "Trade-offs that quietly break a referenced pitch's [MUST] requirement"
        - "Scope creep (ADR decides more than it claims)"
        - "Missing linkage when the decision affects an in-flight feature"

  gate:
    total: 6
    pass_threshold: 5
    reject_on_unresolved: true
    unresolved_tag: "[TBD]"
    criteria:
      - id: context_clear
        label: "Context clear"
        pass_condition: "Third party summarizes trigger in ≤3 lines; no [TBD] tags remain."
      - id: decision_singular
        label: "Single declarative decision"
        pass_condition: "A single declarative sentence, not a paragraph of hedges."
      - id: consequences_balanced
        label: "Consequences balanced"
        pass_condition: "≥2 positive AND ≥2 negative consequences explicitly listed."
      - id: alternatives_considered
        label: "Alternatives considered"
        pass_condition: "≥2 alternatives with rejection reason."
      - id: revisit_trigger_present
        label: "Revisit trigger present"
        pass_condition: "≥1 metric, milestone, or scheduled review date."
      - id: references_valid
        label: "References valid"
        pass_condition: "references.pitches non-empty (unless _global), all referenced files exist."
