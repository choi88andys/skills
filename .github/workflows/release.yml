name: Auto Release on Tag

# A release tag (immutable--vX.Y.Z) creates the GitHub Release and moves two channel
# tags to the same commit: immutable--latest (every release, majors included) and the
# major channel immutable--vX (releases of that major only).
#
# WHY A CHANNEL TAG
# Every consumer CI pinned an exact tag, so each release meant editing IMMUTABLE_REF
# in every repo that runs the validator, and the repos drifted apart: on 2026-11-20
# the two spec repos ran v0.21.2, the tracker v0.19.0, did_client v0.9.0 and
# lounge-x-app v0.17.0. A repo that sets IMMUTABLE_REF to a channel follows releases
# with no edit; one that wants a frozen gate keeps an exact tag. immutable--latest is
# what the plugin owner's own repos use: a major release reaches them too, because the
# same person ships the plugin and runs those gates. immutable--vX stops at its major,
# for a consumer that wants a breaking release only when it moves.
#
# WHY THE CHANNELS MOVE ONLY FORWARD
# A patch cut on an older line after a newer release (v0.20.5 after v0.21.2) would
# otherwise drag every channel consumer back to it. Each channel goes to the highest
# version it covers (all releases, or those of one major), which is this tag only
# when nothing newer exists.
#
# WHY THE PUSH CANNOT LOOP
# immutable--vX matches this workflow's own trigger, but a push made with GITHUB_TOKEN
# starts no workflow. A major channel pushed by hand (recovery) does start one, and
# the release step skips any tag that is not a full X.Y.Z version. immutable--latest
# does not match the trigger at all.

on:
  push:
    tags:
      - 'immutable--v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Skip a tag that is not a full release version
        id: kind
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^immutable--v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "channel=immutable--v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is not immutable--vX.Y.Z (a channel tag or a typo): no release, no channel move."
          fi

      - name: Checkout (full history for release notes)
        if: ${{ steps.kind.outputs.release == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        if: ${{ steps.kind.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#immutable--}"
          gh release create "$TAG" \
            --title "$VERSION" \
            --generate-notes

      - name: Move the channel tags to this release
        if: ${{ steps.kind.outputs.release == 'true' }}
        env:
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ steps.kind.outputs.channel }}
        run: |
          git fetch --force --tags origin
          # move <channel> <regex of the release tags it covers>
          move() {
            local newest
            newest="$(git tag -l | grep -E "$2" | sort -V | tail -1)"
            if [ "$newest" != "$TAG" ]; then
              echo "$1 left where it is: $TAG is not the newest release it covers ($newest is)."
              return 0
            fi
            git tag -f "$1" "$TAG^{commit}"
            git push --force origin "refs/tags/$1"
            echo "$1 -> $TAG ($(git rev-parse --short "$TAG^{commit}"))"
          }
          move immutable--latest '^immutable--v[0-9]+\.[0-9]+\.[0-9]+$'
          move "$CHANNEL" "^${CHANNEL}\.[0-9]+\.[0-9]+$"
