# immutable plugin config (v0.5 — config schema v3).
#
# This starter bootstraps an English-language single-repo (pitches + ADRs in
# the same repo). Pitches live in `spec/pitches/`; ADRs at the app repo root.
#
# Config lives at app repo root so the walk-up resolver finds it whether
# `/immutable:prd` is invoked from inside spec/ or `/immutable:adr` from
# alongside ADRs.

version: 3

repo_mode: single-repo

team_language: en

# Pitches in a subtree (separates from implementation).
pitches_path: spec/pitches/

# ADRs at the app repo root alongside code.
adr_path: adr/

templates:
  pitch: spec/pitches/TEMPLATE.md
  adr: adr/TEMPLATE.md

# Profile selection (optional in v0.5).
# Unset → bundled default profile matching `team_language`.
# profile: .immutable-prd/profile.yml

# Requirement contract (v0.11+, optional).
#
# Declare this when pitches in this repo are authored against tracker tickets
# whose designated sections bind them (immutable/SCHEMA.md "Requirement
# contract"). Absent → /immutable:prd never mentions tickets and the validator
# checks nothing new. The binding headings, the three deviation categories and
# the disagreement vocabulary come from the profile.
#
# requirement_contract:
#   enforcement: optional        # optional | required
#   tracker: github              # label recorded in each pitch's references.tickets[]
#   repo: my-org/task-tracker    # default repository for a bare ticket id
#   since: 2026-01-01            # adoption date — under required, older pitches are exempt
#   response_window: "2 business days"   # rendered verbatim into correction requests; no clock
#   # fetch_command: "python3 tools/ticket.py {id}"   # custom adapter; unset → gh api graphql
