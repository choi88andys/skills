    lightweight scope check 가 mandatory 로 동작 (CEO 의 nuclear scope challenge
    대신). Phase 3 ADR trigger 도 cross-reference 할 CEO Phase 3 가 없으니, eng
    가 발견한 architecture 결정은 모두 surface 합니다.

  pre.phase0.standalone_scope_check: |
    Standalone scope check:
      Files touched: {files_touched}
      New abstractions (services/classes/modules): {new_abstractions}

    Threshold: ≥ 8 files OR ≥ 2 new abstractions = standalone fast-path 보다 큼.
    {smell_status}

    {choice_block}

  pre.phase0.late_changes: |
    이 브랜치에 CEO 리뷰 노트 작성 이후 추가 commit 이 있습니다:

    {commits_since_ceo}

    CEO 리뷰가 보지 못한 변경입니다. eng 리뷰는 이 delta 도 cover 합니다.

  pre.warn.no_design_note: |
    ⚠ Design handoff note 미존재 — `{expected_path}`.

    이 노트는 `/immutable:design` 이 작성하는 app-side context (module
    placement, activation status, dependent features) 입니다. eng 리뷰의
    grounding 입력이며, 없으면 4 sections 리뷰가 **degraded mode** 로 동작합니다
    — 코드 placement / 의존 모듈을 모르고 진행하므로 Section 1 (Architecture) /
    Section 4 (Performance) 의 판단이 약해지고, worktree 분석은 module-level
    추정이 어려워집니다.

    Mode: `{review_mode}` — ceo-grounded 라면 CEO 리뷰가 이미 동일 warn 을
    surface 했을 수 있습니다 (사용자가 그때 (B) 를 골랐다면 eng 가 다시 묻는 것).
    Standalone 이라면 upstream gate 가 없으므로 본 prompt 가 첫 결정 지점.

    선택 (silent-skip 은 허용되지 않음):

    - (A) **일시정지하고 `/immutable:design <slug>` 먼저 실행** (권장)
        디자인 노트 작성 후 본 skill 을 다시 invoke.

    - (B) Degraded mode 로 진행
        Phase 4.2 리뷰 노트 scope-context 섹션에 `degraded: no_design_note`
        를 기록. Section 리뷰는 진행되지만 app-side context 가 비어있다는
        제약을 downstream (ship) 이 인지함.

    - (C) 작업 중단

  pre.phase2.skip_summary: |
    Phase 2 (worktree analysis) skip — 이유: {reason}

    노트에는 "Sequential implementation, no parallelization opportunity." 로 기록.

  pre.phase2.dependency_table_template: |
    Phase 2.2 dependency table:

    | Step | Modules touched | Depends on |
    |------|----------------|------------|
    {rows}

    Module / directory 레벨로 작성 (file 단위 추측은 unreliable).

  pre.phase2.parallel_lanes_template: |
    Phase 2.3 parallel lanes:

    {lanes}

    동일 module 을 touch 하는 step 은 같은 lane (sequential).
    독립 module + 의존성 없으면 별도 lane (parallel).

  pre.phase2.execution_order_template: |
    Phase 2.4 execution order:

    {order_description}

  pre.phase2.conflict_flag_template: |
    ⚠️ Lane conflict: lanes {lane_a} 와 {lane_b} 모두 module `{module}` 을 touch.
    Merge conflict 위험. sequential 실행 또는 careful coordination 필요.

  pre.phase3.adr_recommendation: |
    ADR 작성 권장: "{adr_title}"

    원인 (Section {section}): {reason}

    실행: app repo 에서 `/immutable:adr`. 이 ADR 은 pitch `{pitch_filename}` 을
    참조해야 합니다 (frontmatter `references.pitches: [{pitch_filename}]`).

    CEO 리뷰 Phase 3 에서 이미 flag 된 ADR 후보와 중복되면 cross-reference 만 남기고
    중복 surface 하지 마세요.

  pre.phase4.verdict_question: |
    Phase 4 verdict (eng):

    - APPROVE — 구현 → (필요하면) `/immutable:adr` → `/immutable:ship`. Phase 3
      ADR trigger 는 구현 전/중에 처리.
    - REVISE — code-level issue 가 plan 의 shape 에 영향. 일시정지, plan 갱신 후 재호출.
    - REJECT — engineering 차원에서 scope 또는 approach 가 변경되어야 함. CEO 리뷰
      또는 office-hours 로 돌아가기 권장.

  pre.phase4.auto_advanced: |
    Phase 4 verdict (eng): 자동 승인 → APPROVE.

    `immutable-plan-review-eng`의 autonomy policy가 `live`이고 이번 리뷰가 클린(APPROVE, 미해결 이슈 0건, ADR 트리거 0건)하여, 평소의 AskUserQuestion 없이 verdict가 자동 선택되었습니다. 감사 기록(audit receipt)이 작성되었습니다. Ship은 여전히 별도의 human-gated 단계입니다 — review verdict만 자동 진행되었습니다.

  pre.phase4.review_note_written: |
    Eng review note 작성 완료: `{path}`

    포함:
    - Verdict + 한 줄 rationale
    - Section 1-4 highlights
    - Test Coverage Diagram (Section 3)
    - Worktree Analysis (Phase 2 — 또는 skip rationale)
    - ADR-authoring candidates (Phase 3)
    - Late-changes note (CEO 리뷰 이후 commit 이 있다면)

  pre.phase4.handoff_to_ship: |
    Verdict: APPROVE
    Eng review note: `{path}`

    구현 권장 순서:
    1. Phase 3 ADR trigger 가 있으면 먼저 `/immutable:adr` 호출 (또는 구현 도중)
    2. 구현 진행 (Test Coverage Diagram 을 checklist 로 사용)
    3. 모든 테스트 green 후 `/immutable:ship` 호출

    ADR triggers (이번 리뷰에서 surface 됨):
    {adr_triggers}

  pre.phase4.handoff_to_revise: |
    Verdict: {verdict}
    Eng review note: `{path}`

    {next_step_description}

    {recommendation}

  pre.refuse.spec_only_repo: |
    이 디렉토리는 spec-only 레포 (`repo_mode: two-repo-spec`) 입니다.

    plan-review-eng 는 implementation repo 에서 호출하는 스킬입니다.
    Implementation repo 로 이동 후 다시 호출하세요.

    작업을 중단합니다.

  pre.refuse.ceo_not_approved: |
    CEO 리뷰 ({ceo_note_path}) 가 REVISE / REJECT 상태입니다 — eng 리뷰 진행 불가.

    현재 상태: {ceo_status}

    CEO 가 이미 surface 한 blocker (scope 변경, pitch supersede, premise flip 등)
    가 해결되기 전엔 eng 리뷰가 의미가 없습니다. 옵션:

    - (A) CEO 리뷰의 issue 를 먼저 해결 후 `/immutable:plan-review-ceo` 다시 실행
      해서 APPROVE 받기 (가장 일반적)
    - (B) Pitch supersede 가 필요하다면 spec repo 에서 `/immutable:prd` 로 supersede
      한 후 CEO 부터 재실행
    - (C) 작업 중단

    참고: CEO 리뷰 노트 자체가 "없는" 경우엔 standalone 모드로 진행 가능 (Phase
    0.1 의 ceo_missing_question 분기 참조). 이 refusal 은 노트가 있되 verdict 가
    안 좋은 케이스 전용입니다.

  pre.refuse.no_pitch: |
    Pitch 를 찾지 못했고, refactor 모드도 활성화되지 않았습니다.

    Standalone 모드 eng 리뷰는 최소한 pitch 또는 refactor 컨텍스트가 필요합니다.

    옵션:
    - (A) `/immutable:prd` 로 새 pitch 작성 후 다시 호출
    - (B) Refactor 모드를 의도했다면 `/immutable:design` 을 먼저 호출 (Step 1 의
      "refactor" 옵션 선택) 해서 transient note 를 만들고 재호출
    - (C) 작업 중단

  # ==========================================================================
  # ship skill (v0.6.0)
  # ==========================================================================

  ship.step1.mixed_concerns: |
    Diff 검사 결과: pitch 가 다루는 영역 외의 변경이 포함되어 있습니다:

    {unrelated_files}

    옵션:
    - (A) 별도 commit / PR 로 분리 후 다시 호출 (권장 — bisect-friendly)
    - (B) 그냥 진행 (mixed PR 가 의도된 경우)

  ship.step2.hygiene_issues: |
    Commit hygiene 이슈 발견:

    {issues}

    옵션:
    - (A) `git rebase -i` 로 직접 정리 후 다시 호출 (권장)
    - (B) 그대로 진행 — 이 이슈는 verdict 에 flag 됨

    이 스킬은 interactive git 작업을 대신 실행하지 않습니다.

  ship.step3.notes_check: |
    리뷰 artifact 검증:
    - Design note:  {design_note_status}
    - CEO note:     {ceo_note_status}
    - Eng note:     {eng_note_status}
    - Eng verdict:  {eng_verdict}

    {action_hint}

  ship.step4.build_passed: |
    Build & test 통과 (project type: {project_types}).

    실행한 명령:
    {commands_run}

    Test plan 은 eng review 의 Test Coverage Diagram 에서 가져옵니다 — Step 5 PR
    body 의 Test plan 섹션에 자동 포함.

  ship.step4.tests_failing: |
    🛑 Tests failing — PR 작성 중단.

    Failure summary:
    {failure_output}

    이 실패를 fix → 다시 commit → `/immutable:ship` 재호출. 이 스킬은 failing
    tests 로는 PR 을 만들지 않습니다.

  ship.step5.body_preview: |
    PR body 조립 완료. 미리보기:

    Title: {title}

    ---
    {body}
    ---

    옵션:
    - (A) 이대로 PR 생성
    - (B) Body 수정 — 어느 부분을 바꿀까요?
    - (C) 작업 중단

  ship.step6.confirm_create: |
    `gh pr create` 를 실행하면 GitHub 에 PR 이 즉시 생성됩니다 (다른 사람이 볼 수
    있음). 진행할까요?

    Title: {title}
    Base:  {base_branch}
    Head:  {head_branch}

    - (A) 생성
    - (B) Body 수정 후 다시 검토
    - (C) 취소

  ship.step6.pr_created: |
    ✅ PR 생성 완료: {pr_url}

  ship.step7.cleanup_hint: |
    PR 생성 완료: {pr_url}

    Merge 후 권장 작업:
    - Base 브랜치에서 merged commit pull
    - Feature 브랜치 삭제 (local + remote)
    - 구현 도중 추가 architecture 결정이 발생했다면 `/immutable:adr` 로 기록
    - Two-repo 모드: spec repo 에 pitch supersede 가 pending 이라면 그 PR 도 생성
      (이 PR 보다 먼저 또는 나중에 — chain ordering 강제 없음)

    이 스킬은 cleanup 명령을 자동 실행하지 않습니다.

  ship.refuse.spec_only_repo: |
    이 디렉토리는 spec-only 레포 (`repo_mode: two-repo-spec`) 입니다.

    `/immutable:ship` 은 implementation repo 에서 호출하는 스킬입니다.
    Spec repo PR 은 일반 GitHub web / `gh pr create` 로 별도 처리하세요.

    작업을 중단합니다.

  ship.refuse.eng_not_approved: |
    Eng 리뷰가 APPROVE 상태가 아닙니다.

    Path:   `{eng_note_path}`
    Status: {eng_status}

    옵션:
    - (A) `/immutable:plan-review-eng` 다시 실행해서 APPROVE 받기
    - (B) 리뷰가 surface 한 issue 들을 먼저 해결
    - (C) 작업 중단

    `/immutable:ship` 은 eng APPROVE 없이는 PR 을 만들지 않습니다.

  ship.refuse.dirty_tree: |
    Working tree 가 clean 하지 않습니다:

    {git_status}

    옵션:
    - (A) 변경사항을 commit 후 다시 호출
    - (B) `git stash` 후 진행 (revert 가능)
    - (C) 작업 중단

  ship.refuse.protected_branch: |
    현재 브랜치 `{branch}` 는 보호 브랜치 (main / master / develop) 입니다.

    `/immutable:ship` 은 feature / fix / chore 브랜치에서 호출하는 스킬입니다.
    `git switch -c feat/<task-name>` 로 작업 브랜치를 만든 후 재호출하세요.

    작업을 중단합니다.
