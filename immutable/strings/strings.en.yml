    ---
    {body}
    ---

    Options:
    - (A) Create the PR as-is
    - (B) Edit body — which section should change?
    - (C) Cancel

  ship.step6.confirm_create: |
    Running `gh pr create` will open a PR on GitHub immediately (visible to
    others). Proceed?

    Title: {title}
    Base:  {base_branch}
    Head:  {head_branch}

    - (A) Create
    - (B) Edit body and re-preview
    - (C) Cancel

  ship.step6.pr_created: |
    ✅ PR created: {pr_url}

  ship.step7.cleanup_hint: |
    PR created: {pr_url}

    Recommended post-merge actions:
    - Pull the merged commit on the base branch
    - Delete the feature branch (local + remote)
    - If implementation surfaced additional architecture decisions, run
      `/immutable:adr` to record them
    - Two-repo mode: if a pitch supersede is pending in the spec repo,
      open that PR (chain ordering is not enforced — either order works)

    This skill does not run cleanup commands automatically.

  ship.refuse.spec_only_repo: |
    This directory is a spec-only repo (`repo_mode: two-repo-spec`).

    `/immutable:ship` runs in the implementation repo. Handle spec-repo PRs
    via the regular GitHub web UI or `gh pr create` directly.

    Aborting.

  ship.refuse.eng_not_approved: |
    The eng review is not in APPROVE state.

    Path:   `{eng_note_path}`
    Status: {eng_status}

