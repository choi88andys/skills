    1. SCOPE EXPANSION — plan 이 좋지만 더 좋아질 수 있음. 야심 있게.
       각 expansion 은 cherry-pick ceremony 로 개별 opt-in.
    2. SELECTIVE EXPANSION — scope 는 baseline. 가능한 cherry-pick 만 surface.
       neutral 추천.
    3. HOLD SCOPE — scope 가 정확함. 최대 rigor 로 리뷰. expansion 안 봄.
    4. SCOPE REDUCTION — plan 이 overbuilt. minimal 버전 제안 후 그것을 리뷰.

    추천 default: {default_mode} ({reason})

