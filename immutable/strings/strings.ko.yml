  oh.phase1.mode_question: |
    시작하기 전에 — 이번 작업의 성격이 무엇인가요?

    (1) New feature for users — 사용자 노출 기능, 실제 사용자가 있는 변경
    (2) Internal tooling / DX — 팀 내부용 도구
    (3) Refactor / cleanup — 아키텍처 정리, 사용자 비가시
    (4) Exploration / spike — 학습용 탐색, 구현 약속 X

