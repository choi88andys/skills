# strings.en.yml — English workflow prompts for immutable SDD skills.
#
# Mirror of strings.ko.yml. See that file for full documentation of schema,
# key naming convention, interpolation syntax, resolution order, and the
# catalog vs. profile responsibility split.

schema: 1
locale: en

strings:
  # ==========================================================================
  # init skill
  # ==========================================================================

  init.stage1.probe_summary: |
    Current directory state:
    - .git: {git_status}
    - Existing immutable config: {immutable_status}
    - Detected directories: {detected_dirs}
    - Recommended mode: {recommended_mode}
    - Recommendation basis: {recommendation_reason}

  init.stage1.already_initialized: |
    This directory is already initialized with immutable (.immutable-prd/config.yml exists).

    Options:
    - v2 → v3 upgrade: run `/immutable:migrate` (idempotent, zero-data-loss)
    - Re-bootstrap: delete `.immutable-prd/config.yml` first, then rerun `/immutable:init`
    - Apply an additional starter (e.g., single → two-repo split): run init in a separate directory and merge manually

    Aborting.

  init.stage2.mode_question: |
    Which starter would you like?

    (1) two-repo-spec — spec-only repo (pitches/ only; paired with a sibling app repo)
    (2) two-repo-app — app-only repo (adr/ only; references sibling spec repo)
    (3) single-repo — pitches + adr combined (small teams / single-repo layout)

    [Recommendation: ({recommended_number}) — {recommendation_reason}]

    Pick by number or option name.

  init.stage2.mode_conflict_warning: |
    The selected mode ({chosen_mode}) does not fit the detected code directories ({detected_dirs}). Usually {suggested_alternatives} is more appropriate. Proceed anyway?

  init.stage3.language_question: |
    Pick the team's working language:

    (1) Korean (ko)
    (2) English (en) — default for this starter

    [Recommendation: (2)]

    Pick by number. (Additional locales coming in v0.6+.)

  init.stage4.profile_question: |
    Profile (section headings, adversarial review personas, 90% gate criteria, …) handling:

    (1) Use the bundled default — do not set `profile:` in config.yml. The plugin auto-loads default-<lang>. **Recommended (simplest; change later anytime)**
    (2) Copy into this repo — copy the default to `.immutable-prd/profile.yml` and point config at it. Team can edit immediately.
    (3) Skip for now — leave the commented pointer in config. (Same effective behavior as (1).)

    [Recommendation: (1)]

  init.stage4.repo_local_hint: "You can edit the profile file directly to customize sections / personas / gate threshold."

  init.stage4.skip_hint: "To switch to (2) later: run `cp ${CLAUDE_PLUGIN_ROOT}/examples/_profiles/default-{lang}.yml .immutable-prd/profile.yml`, then uncomment the `profile:` line in config.yml."

  init.stage5.copy_report: |
    Copied ({copied_count}):
    {copied_list}

    Skipped (already present, {skipped_count}):
    {skipped_list}

  init.stage5.profile_copy_note: |
    - .immutable-prd/profile.yml (editable)
    - `profile:` line activated in .immutable-prd/config.yml

  init.stage5.spec_path_question: |
    Enter the path to your spec repo (absolute, or relative to this app repo).
    Leave empty to keep the placeholder (`../<your-spec-repo>`) in config.yml and edit it later.
    {suggestion_hint}

  init.stage5.spec_path_suggestion: "Detected spec repo candidate: `{path}` (press Enter to accept, or type a different path)."

  init.stage5.spec_path_no_candidate: "No spec repo candidates found in sibling directories. Type a path, or leave empty to defer."

  init.stage5.spec_path_multiple: |
    Multiple spec repo candidates detected in sibling directories:
    {candidate_list}

    Pick a number, or type a path directly. Leave empty to defer.

  init.stage5.spec_path_set: "`spec_repo_path: {path}` configured (config.yml edited)."

  init.stage5.spec_path_skipped: "Placeholder retained. Edit `spec_repo_path:` in `.immutable-prd/config.yml` before the first `/immutable:adr` run."

  init.stage5.spec_path_missing_target: |
    Note: `{path}` does not exist yet, or is missing `.immutable-prd/config.yml` / `pitches/`.
    If you plan to bootstrap the spec repo next, this is fine — run `/immutable:init` in that repo.
    config.yml is saved with the path you provided.

  init.stage6.git_init_suggestion: |
    This directory is not a git repo. You can initialize it with:

    ```bash
    git init
    git add .
    git commit -m "feat: bootstrap immutable SDD"
    ```

    (The skill does not run git commands. Please run them yourself.)

  init.stage6.git_commit_suggestion: |
    Existing git repo detected. You can commit the changes with:

    ```bash
    git add .
    git commit -m "feat: bootstrap immutable SDD"
    ```

  init.stage7.handoff_two_repo_spec: |
    Bootstrap complete (mode: two-repo-spec, lang: {lang}).

    Next steps:
    1. Run the git commands from Stage 6
    2. Edit `pitches/README.md` allowlist — replace the sample row with your team's actual domains
    3. Write the first pitch: `/immutable:prd`

    Reference:
    - Pitch conventions: `CONTRIBUTING.md`
    - ADRs are authored separately in the sibling app repo (`/immutable:init` for the app starter)

  init.stage7.handoff_two_repo_app_configured: |
    Bootstrap complete (mode: two-repo-app, lang: {lang}).

    `spec_repo_path: {spec_path}` configured.

    Next steps:
    1. Run the git commands from Stage 6
    2. Write the first ADR: `/immutable:adr`

    Reference:
    - ADR conventions: `adr/README.md`
    - Pitches are authored separately in the spec repo (`/immutable:prd` in that repo)

  init.stage7.handoff_two_repo_app_pending: |
    Bootstrap complete (mode: two-repo-app, lang: {lang}).

    Next steps:
    1. Run the git commands from Stage 6
    2. Edit `spec_repo_path: ../<your-spec-repo>` in `.immutable-prd/config.yml` — replace the placeholder with your spec repo path (absolute or relative; no naming convention required)
    3. Write the first ADR: `/immutable:adr`

    Reference:
    - ADR conventions: `adr/README.md`
    - Pitches are authored separately in the spec repo (`/immutable:prd` in that repo)

  init.stage7.handoff_single_repo: |
    Bootstrap complete (mode: single-repo, lang: {lang}).

    Next steps:
    1. Run the git commands from Stage 6
    2. Edit the allowlist in `spec/pitches/README.md`
    3. Write the first pitch: `/immutable:prd` (or the first ADR: `/immutable:adr`)

    Reference:
    - Pitch conventions: `spec/CONTRIBUTING.md`
    - ADR conventions: `adr/README.md`

  init.probe.status_present: "present"
  init.probe.status_absent: "absent"
  init.probe.immutable_with_config: "present (config.yml detected)"

  # ==========================================================================
  # prd skill
  # ==========================================================================

  prd.stage1.intent_question: "What are you about to write? Describe it in one or two sentences."

  prd.stage1.no_pitches_dir: "No `pitches/` directory found in the current directory. Please rerun from the spec repo root."

  prd.stage1.confirmation: |
    [{domain}] {intent_desc}
    Base file: {base_file}
    {anti_monolith_summary}
    Start the interview?

    (1) Confirm — start the interview
    (2) Different domain — specify manually
    (3) New domain — walk through the allowlist addition flow
    (4) Deprecate only — flip `deprecated` without interviewing

  prd.intent_desc.new: "interpreted as adding a new PRD to the existing domain (separate supersede chain — multiple actives per domain are normal)"
  prd.intent_desc.new_domain: "interpreted as a new domain + new PRD"
  prd.intent_desc.update: "interpreted as re-declaring the exact scope of a specific existing PRD (rare — supersede on the same chain)"
  prd.intent_desc.refactor_split: "interpreted as decomposing an oversized PRD into N small PRDs (no semantic change, structural refactor only)"
  prd.intent_desc.split_from: "interpreted as decomposing an oversized PRD then applying a new change to one of the resulting small PRDs (Stage 1 + Stage 2)"
  prd.intent_desc.deprecate_only: "interpreted as a deprecate-only flip"

  # Anti-monolith pre-check (v0.5.6+).
  prd.stage1.anti_monolith_summary_template: |
    Active PRDs in this domain (anti-monolith tier):
    {per_pitch_rows}
  prd.stage1.anti_monolith_row_pass: "  - {filename} [pass — {sub_count} sub-sections, {norm_count} normatives]"
  prd.stage1.anti_monolith_row_l1: "  - {filename} [L1 hint — {sub_count} sub-sections, {norm_count} normatives]"
  prd.stage1.anti_monolith_row_l2: "  - {filename} [L2 — split recommended; update requires reason]"
  prd.stage1.anti_monolith_row_l3: "  - {filename} [L3 — update blocked. only refactor-split / split-from / new are offered]"
  prd.stage1.anti_monolith_l3_block_message: |
    The selected operation would `update` an L3 PRD `{filename}`.
    This PRD has {sub_count} sub-sections and {norm_count} normatives, exceeding
    the anti-monolith L3 thresholds. `update` is blocked. Choose one of:

    (a) refactor-split — decompose into N small PRDs without semantic change (Stage 1 only)
    (b) split-from     — decompose then apply your new change (Stage 1 + Stage 2)
    (c) new            — add a separate small PRD; leave the existing one alone

  # Profile schema mismatch detection (v0.5.7+) — surfaces silent-skip when
  # team profile predates plugin update (e.g., v0.5.0-era v1 profile + v0.5.6 plugin).
  prd.stage1.profile_schema_mismatch: |
    ⚠ Profile schema mismatch — team profile v{team_schema}, bundled default v{bundled_schema}.

    Missing fields: {missing_fields}

    For this run, bundled default values are used as fallback (no disk write).
    To make permanent:

    ```
    /immutable:migrate
    ```

    (Overrides preserved — only missing fields are added.)

  prd.stage1.profile_fallback_annotation: " (from bundled default-{team_language} v{bundled_schema} — your team profile is v{team_schema})"

  prd.stage1.anti_monolith_skipped_no_threshold: |
    ⚠ anti-monolith pre-check skipped — profile lacks both `anti_monolith` block and `sections[user_stories].max_items` field. Run `/immutable:migrate` to enable.

  # Stage 5 anti-monolith warnings (v0.5.6+)
  prd.stage5.l1_hint: "anti-monolith L1 hint — {sub_count} sub-sections, {norm_count} normatives. Allowed to proceed, but consider smaller PRDs for subsequent work."
  prd.stage5.l2_warning: "anti-monolith L2 — {sub_count} sub-sections, {norm_count} normatives. The in-flight PRD is likely a multi-feature bundle. Proceed anyway?"
  prd.stage5.concern_scope_violation: "concern_scope criterion failed (L3) — {sub_count} sub-sections / {norm_count} normatives. The in-flight PRD is too large. Run refactor-split first."

  # Refactor-split (v0.5.6+) — §1.7
  prd.refactor_split.boundary_proposal: |
    Original PRD: {original_filename} ({sub_count} sub-sections, {norm_count} normatives)

    Split candidates (N = {n}):
    {candidates}

    Cross-cutting (not bound to any single sub-section):
    {cross_cutting}

    Proceed: (a) accept proposal (b) adjust boundaries (c) merge candidates (d) cancel
  prd.refactor_split.cross_cutting_question: "Which sub-section owns this item? (a) {section_a} (b) {section_b} ... (z) cross-section — extract into a separate small PRD"
  prd.refactor_split.sanity_failure: |
    Sanity check failed — the following items are missing or duplicated in the proposed split:

    {issues}

    No file written. Returning to boundary adjustment.
  prd.refactor_split.handoff: |
    refactor-split complete. Files written:

    New (active):
    {new_files}

    Deprecated: {original_filename}

    Suggested commit message:
      refactor({domain}): split {original_filename} into {n} sub-pitches

    This is a structure-only refactor (no semantic change). Commit as a single commit for clarity.

  # Split-from (v0.5.6+) — §1.8
  prd.split_from.stage2_prompt: "Stage 1 (refactor-split) complete. Proceed to Stage 2 (apply the new semantic change)? (Y) continue / (N) end here so the refactor commit stands alone — invoke /immutable:prd later for the update"
  prd.split_from.stage2_target_question: "Which split-out PRD does the new change target? {candidates}"

  prd.stage1_5.intake_prompt_verbatim: |
    Attach supporting material if you have any (reply 'none' if not). Only the following are accepted:

    (a) Figma — single frame/node URLs, 1–3 only
        Example: figma.com/design/.../?node-id=123-456
        ※ Full-file URLs are rejected.

    (b) Notion/Docs — one feature summary page
        ※ Workspace root URLs are not allowed.

    (c) Local files — .md/.txt, up to 5 pages

    (d) Pasted text — distilled notes, 30 lines max
        Full chat logs are not accepted; focus on decisions/requirements.

  prd.stage1_5.summary_confirmation: "Here is what I read from this material. Is my interpretation correct? Flag anything wrong or out of this pitch's scope."

  prd.stage1_5.scope_alignment: "From these materials, what must go into this pitch, and what behavior must the pitch add that is NOT in the source materials?"

  prd.stage3.identifier_warning: "The body contains a code identifier '`{identifier}`'. Replace with a domain term. (Detected pattern: {hint})"

  prd.stage6.handoff: |
    Generated file:
    - `{new_file_path}`
    {deprecated_line}

    How to register (pick one)

    {github_web_steps}

    {cli_steps}

  prd.stage6.deprecated_line: "- (on update) `{old_file_path}` — flipped to deprecated: true"

  prd.stage6.missing_required_section: |
    Stopping file generation. The profile requires sections that are missing from the assembled body.

    Missing:
    {missing_headings}

    Return to the Stage 2 interview, fill the missing content, then re-enter Stage 6.

  prd.stage6.missing_story_structure: |
    Stopping file generation. Under `sections[user_stories].structure = per_story_grouped`, the user-stories section does not meet the required shape.

    Issues:
    {offending_sections}

    Rules:
      1. The user-stories section (`## <heading>`) MUST contain **≥2** `### ` sub-sections.
      2. Each `### ` sub-section MUST contain at least one normative keyword at the **head** of a bullet item (e.g. `- **[MUST]** …`, `- [MUST NOT] …`). Nested bullets (`  - **[MUST]** …`) are valid.
      3. Inline-position normative is NOT accepted — this covers both paragraph prose (`the system **[MUST]** show the card first`) AND bullet items where the bracket is mid-sentence (`- the system **[MUST]** show the card first`). The bracket must be at the head of the bullet (optionally preceded only by `**`/`_` emphasis).
      4. A Given/When/Then triple is recommended but may be omitted for cross-cutting groups (e.g., shared result-code handling across channels).
      5. Normative lines must live INSIDE a sub-section. Leaking them between the H2 and the first `### ` breaks the story↔criterion link.

    Return to Stage 2 Branch B to re-elicit the missing per-story content, then re-enter Stage 6.

  prd.stage3.inline_normative_warning: |
    The body contains a normative keyword not at the head of a bullet: "{line}"

    Rule: bracketed tokens (`[MUST]` / `[MUST NOT]` / `[SHOULD]` / …) MUST sit at the **head** of a bullet item (optionally preceded only by `**`/`_` emphasis markers).
      - OK: `- **[MUST]** the system does …`, `  - [SHOULD] the system …`
      - Rejected (paragraph prose): `the system **[MUST]** do X`
      - Rejected (mid-bullet prose): `- the system **[MUST]** do X`

    Both rejected forms defeat grep/CI extraction. Return to Stage 2 Branch B/C and rewrite in bullet-head form.

  prd.stage3.vague_word_warning: |
    The body contains vague language: "{word}"
    Location: {line}

    Hedge words ("appropriate", "reasonable", "naturally", "sufficient", "as needed", "smoothly") let implementers fill the gap arbitrarily and create drift. Replace with concrete values (numbers, timeouts, thresholds, UI specs), or confirm with the user that the ambiguity is intentional in context.

    Return to Stage 2 Branch B/C to rewrite the sentence.

  # ==========================================================================
  # adr skill
  # ==========================================================================

  adr.stage1.intent_question: "What decision are you about to make? Describe it in one or two sentences."

  adr.stage1.scope_question: |
    What is the scope of this decision?
    (1) Bound to a specific domain's pitch (name the domain)
    (2) Global decision spanning multiple domains/features (`_global`)

  # Profile schema mismatch detection (v0.5.7+) — mirrors prd version.
  adr.stage1.profile_schema_mismatch: |
    ⚠ Profile schema mismatch — team profile v{team_schema}, bundled default v{bundled_schema}.

    Missing fields: {missing_fields}

    For this run, bundled default values are used as fallback (no disk write).
    Run `/immutable:migrate` to make permanent (overrides preserved).

  adr.stage1.anti_monolith_skipped_no_threshold: |
    ⚠ ADR anti-monolith pre-check skipped — `adr.anti_monolith` block missing in both team and bundled profile. Run `/immutable:migrate` to enable.

  adr.consequences.positive_heading: "Positive"
  adr.consequences.negative_heading: "Negative / Trade-offs"
  adr.consequences.cost_of_adoption_heading: "Cost of adoption / Neutral"

  adr.stage6.missing_required_section: |
    Stopping file generation. The profile requires sections that are missing from the assembled body.

    Missing:
    {missing_headings}

    Return to the Stage 3 interview, fill the missing content, then re-enter Stage 6.

  # ==========================================================================
  # migrate skill  (v0.5 / S4)
  # ==========================================================================

  migrate.stage1.not_initialized: |
    Could not find `.immutable-prd/config.yml` in the current directory or any parent.

    `/immutable:migrate` only runs against an already-initialized immutable SDD repo. If you are starting a new repo, run `/immutable:init` first.

    Aborting.

  # v0.5.6 alias — backward-compat for callers wired to old key.
  migrate.stage1.already_v3: |
    This repo is at config schema v{current_version} ({config_path}).

    Note: as of v0.5.7, `/immutable:migrate` also handles profile field migration. This message is a v0.5.6 backward-compat alias — check profile_schema state separately.

  migrate.stage1.fully_current: |
    Already up to date:
    - config: v{current_version} ({config_path})
    - profile: schema v{profile_schema} ({profile_path})

    No further action required. `/immutable:migrate` is idempotent — re-running is safe.

    To edit profile fields, open `.immutable-prd/profile.yml` directly. Fields you do not edit fall back to the bundled default.

    Aborting.

  migrate.stage1.profile_missing: |
    Config is at v3 but the team profile file is missing ({profile_dest_path}).

    Either someone deleted profile.yml or the `profile:` line in config.yml points elsewhere. Recover by either:

    ```bash
    cp ${CLAUDE_PLUGIN_ROOT}/examples/_profiles/default-{team_language}.yml {profile_dest_path}
    ```

    Or re-run `/immutable:init` (existing files are preserved).

    Aborting.

  migrate.stage1.profile_ahead_of_plugin: |
    Team profile schema (v{team_profile_schema}) is ahead of the bundled default schema (v{bundled_profile_schema}).

    The plugin may have been downgraded, or you imported a profile migrated by a newer plugin version elsewhere. Update the plugin to the latest and re-run:

    ```bash
    claude plugin install immutable@latest
    ```

    Aborting.

  # v0.5.6 alias — kept for backward-compat. New routing-aware templates below.
  migrate.stage2.plan_preview: |
    The following changes will be made:

    1. Config schema version bump: {current_version} → {target_version}
    2. Copy bundled profile: {profile_source_path} → {profile_dest_path}
    3. Uncomment `# profile: ...` in config.yml → `profile: .immutable-prd/profile.yml`

    Preconditions:
    - The operation is idempotent (skips safely if already v3 or profile.yml exists).
    - No git commands are executed — review the changes and commit yourself.

    Proceed? (yes / no)

  migrate.stage2.plan_preview_full: |
    The following changes will be made (config v{current_version}→v{target_version} + profile schema migration):

    [Config migration]
    1. Config schema version bump: v{current_version} → v{target_version}
    2. Copy bundled profile (when missing): {profile_source_path} → {profile_dest_path}
    3. Uncomment `# profile: ...` in config.yml → `profile: .immutable-prd/profile.yml`

    [Profile field migration — team profile schema v{team_profile_schema} → v{bundled_profile_schema}]
    {profile_field_diff}

    Preconditions:
    - The operation is idempotent — already-applied changes are skipped safely.
    - Existing profile values are preserved (overrides intact). Only missing fields are added.
    - No git commands are executed — review the changes and commit yourself.

    Proceed? (yes / no)

  migrate.stage2.plan_preview_profile_only: |
    Config is already at v3. Migrating profile schema only.

    [Profile field migration — team profile schema v{team_profile_schema} → v{bundled_profile_schema}]
    {profile_field_diff}

    Preconditions:
    - Existing profile values are preserved (overrides intact). Only missing fields are added.
    - The operation is idempotent — already-applied changes are skipped safely.

    Proceed? (yes / no)

  migrate.stage2.plan_preview_config_only: |
    Config schema v{current_version} → v{target_version} migration (profile is fresh-copied so schema check passes automatically).

    1. Copy bundled profile: {profile_source_path} → {profile_dest_path}
    2. Config schema version bump: v{current_version} → v{target_version}
    3. Uncomment `# profile: ...` in config.yml

    Proceed? (yes / no)

  migrate.stage2.user_declined: |
    Migration cancelled. No files changed.

    Aborting.

  migrate.stage3.profile_exists_warning: |
    {profile_dest_path} already exists. Preserving it and skipping the copy. The version bump and `profile:` line activation in config.yml will still proceed.

  migrate.stage4.handoff: |
    Migration complete:
    - {config_path}: upgraded to version 3, `profile:` line activated
    - {profile_path}: repo-local profile ready (editable)

    Next steps:

    ```bash
    git add .immutable-prd/config.yml .immutable-prd/profile.yml
    git commit -m "chore(immutable): migrate config v2 → v3"
    ```

    Notes:
    - Edit any of the sections / personas / gate / naming fields in profile.yml freely.
    - Fields you do not edit fall back to the bundled default.
    - To roll back on trouble: `git restore .immutable-prd/config.yml` + `rm .immutable-prd/profile.yml`.

  # v0.5.7 — Stage 5 (profile field migration) and Stage 6 (final handoff)

  migrate.stage5.already_current: |
    Team profile schema (v{team_profile_schema}) already matches bundled default (v{bundled_profile_schema}). Profile field migration skipped.

  migrate.stage5.field_added: "  + {field_path}: {description}"
  migrate.stage5.field_skipped_present: "  · {field_path}: already present — skip (override preserved)"

  migrate.stage5.execute_progress: |
    Profile field migration in progress:
    {field_results}

    profile_schema bump: v{team_profile_schema} → v{bundled_profile_schema}

  migrate.stage5.edit_failure: |
    Failed to edit profile.yml: {field_path}

    Skill could not find expected text or it was not unique. The user may have reformatted or hand-edited the profile. Resolve by either:

    1. Manual merge: copy the `{field_path}` block from `${CLAUDE_PLUGIN_ROOT}/examples/_profiles/default-{team_language}.yml` directly into the team profile.
    2. Full profile replacement (loses overrides): `cp ${CLAUDE_PLUGIN_ROOT}/examples/_profiles/default-{team_language}.yml {profile_dest_path}` — existing customizations are gone.

    Aborting Stage 5. Other stage changes are commit-safe (Stage 5 is not atomic).

  migrate.stage5.verify_failure: |
    profile.yml verification failed: {assertion}

    The file is not in the expected state. Recommended rollback:

    ```bash
    git restore .immutable-prd/profile.yml
    ```

    Then inspect manually and re-run `/immutable:migrate`.

  migrate.stage6.handoff: |
    Migration complete:
    {stages_run}

    Files:
    - {config_path}
    - {profile_path}
    {post_migration_notes}

    Next steps:

    ```bash
    {commit_suggestion}
    ```

    Notes:
    - Edit any of the sections / personas / gate / naming / anti_monolith fields in profile.yml freely.
    - Fields you do not edit fall back to the bundled default.
    - To roll back on trouble, `git restore` the changes shown above.

  migrate.stage6.note_concern_scope_threshold: |
    NOTE: `concern_scope` gate criterion was added but `gate.total` / `gate.pass_threshold` were NOT changed (override-preservation policy).
    To include this criterion in the gate pass condition, edit manually:

    ```yaml
    gate:
      total: 8           # was 7
      pass_threshold: 7  # was 6
    ```

  # ==========================================================================
  # common (shared across skills)
  # ==========================================================================

  common.anti_dumping.file_too_large: "Attached file is too long (over 5,000 words). Please specify only 1–3 relevant sections."
  common.anti_dumping.figma_root_url: "Figma full-file URLs are rejected. Resubmit a single frame/node URL that includes a `node-id` query."
  common.anti_dumping.figma_too_many: "Too many Figma node URLs. Keep to 1–3 core screens."
  common.anti_dumping.notion_root_url: "Notion workspace root or DB view URLs are rejected. Resubmit a single feature-related page URL."
  common.anti_dumping.too_many_pages: "Attachments exceed 10 pages total. Distill to essentials first."
  common.anti_dumping.pasted_too_long: "Pasted text exceeds 30 lines. Distill to key decisions/requirements."
  common.anti_dumping.auth_url: "Authenticated URLs cannot be fetched. Paste the summary as text instead."

  common.gate.refusal_template: |
    Generation criteria not yet met:

    {criteria_rows}

    {next_action}

  common.gate.row_template: "□ [{n}] {label} — {status}"
  common.gate.status_pass: "pass"
  common.gate.status_fail: "fail"

  common.adv_review.accept: "Accept"
  common.adv_review.move_to_no_go: "Move to No-go"
  common.adv_review.reject: "Reject"

  common.handoff.github_web_steps: |
    [A] GitHub web — recommended
      1. Open the spec repo on GitHub
      2. Upload or create the file at the path above
      3. Commit message convention (see CONTRIBUTING.md):
         - new: `feat(pitch): add <domain> - <slug>`
         - update: `feat(pitch): update <domain> - <gist>`
         - deprecate: `chore(pitch): deprecate <domain> - <reason>`
      4. Select "Commit directly to main"

  common.handoff.cli_steps: |
    [B] CLI
      git add pitches/<path>
      git commit -m "<message>"
      git push origin main

  common.placeholder.none: "none"
  common.placeholder.n_a: "N/A"
  common.separator.or: " or "
  common.separator.list_comma: ", "

  common.fallback_warning: "⚠️ strings fallback: `{key}` missing in strings.{requested_locale}.yml — using strings.en.yml"

  # --------------------------------------------------------------------------
  # Shared keys for v0.6.0+ flow skills (office-hours, design, plan-review-*,
  # ship). Each new skill calls into these for cross-cutting concerns:
  # legacy-mode refusal, protected-branch warning, transient-artifact hints.
  # --------------------------------------------------------------------------

  common.refuse_legacy_mode: |
    This directory is not an immutable SDD repo (`.immutable-prd/config.yml` not found).

    The `/immutable:office-hours`, `/immutable:design`, `/immutable:plan-review-ceo`,
    `/immutable:plan-review-eng`, and `/immutable:ship` skills require immutable-prd mode.

    Options:
    - Bootstrap a new immutable SDD repo: `/immutable:init`
    - Calling from inside an existing spec/app repo: cd into that repo and rerun
    - Non-standard layout: write a `.claude/sdd-mode` pointer file (see SCHEMA.md
      for the format)

    Aborting.

  common.protected_branch_warn: |
    ⚠️ The current branch `{branch}` looks like a protected branch (main / master / develop).
    Be careful that this skill's transient writes do not land directly on the protected branch.
    If your team forbids direct commits to protected branches, switch to a working branch first:
        git switch -c feat/<your-task-name>

  common.transient_namespace_hint: |
    This skill writes transient notes under `.claude/immutable/`.
    The init starter adds this directory to .gitignore so the notes are not committed.
    For manually-bootstrapped repos, add `.claude/immutable/` as a one-liner to your .gitignore.

  common.handoff.next_skill: "Next step: invoke `{next_skill}`"

  # ==========================================================================
  # office-hours skill (v0.6.0)
  # ==========================================================================

  oh.phase1.mode_question: |
    Before we dig in — what's the nature of this work?

    (1) New feature for users — product-facing, has real users
    (2) Internal tooling / developer experience — team-facing
    (3) Refactor / cleanup — architecture, not user-visible
    (4) Exploration / spike — learning, not committing

    Pick a number.

  oh.phase1.context_summary_template: |
    Here is what I understand about this project and the area you want to change:

    {summary}

    Is this summary accurate? (Y) Proceed | (N) Add context

  oh.phase2.premise_challenge_intro: |
    Before proposing any approach, I want to confirm the premises the framing
    assumes. We will walk one premise at a time and you confirm or revise each.

    PREMISES:
    {numbered_premises}

  oh.phase2.premise_question_template: |
    Premise {number}: {statement}

    Do you agree with this premise?
    - (A) Agree — move to next premise
    - (B) Disagree — explain how it's different
    - (C) Partial — propose a revision

  oh.phase2.premises_locked: |
    All premises confirmed. Moving to Phase 3 (generate 3 alternatives).

  oh.phase3.alternatives_intro: |
    Now I will produce 3 implementation approaches. **Non-negotiable**: A (Minimal
    viable) + B (Ideal architecture) + C (Creative / lateral) all required. If C
    cannot be generated as a meaningfully different framing, I will say so
    explicitly with a reason — never fake a third option.

    The Phase 3 authoring guide (what each slot means, common failures, worked
    examples) lives at `${{CLAUDE_PLUGIN_ROOT}}/office-hours/premise-rubric.md`.
    Read it now before proceeding.

  oh.phase3.approach_template: |
    APPROACH {letter}: {name}
      Summary: {summary}
      Effort:  {effort}
      Risk:    {risk}
      Pros:    {pros}
      Cons:    {cons}
      Reuses:  {reuses}

  oh.phase3.recommendation_template: |
    RECOMMENDATION: Approach {letter} because {one_line_reason}.

  oh.phase3.choice_question: |
    Which approach should we proceed with?
    - (A) Approve the recommended approach — proceed to Phase 4
    - (B) Pick a different approach — specify which
    - (C) Regenerate — my framing changed or I want new options
    - (D) None of these — start over from Phase 1

  oh.phase4.design_doc_path_announce: "Design doc output path: `{path}`"

  oh.phase4.design_doc_written: |
    Design doc written: `{path}`

    This is a transient note (in `.claude/immutable/` namespace, gitignored)
    intended as the Stage 1.5 Context Intake input for the next skill,
    `/immutable:prd`.

  oh.phase5.handoff_immutable_prd_single: |
    Single-repo mode (config detected: `{config_path}`)

    Next step: invoke `/immutable:prd` from the same directory.
    Attach this design-doc path as the Stage 1.5 Context Intake input:
      `{design_doc_path}`

  oh.phase5.handoff_immutable_prd_two_repo: |
    Two-repo mode (this directory: `{primary_role}`)

    Next step: cd into the spec repo, then invoke `/immutable:prd`.
      Spec repo path: `{spec_repo_path}`
      Spec config:    `{spec_config_path}`

    Attach this design-doc path as the Stage 1.5 Context Intake input:
      `{design_doc_path}`

    The spec repo is a separate git repo, but the design doc lives in this
    repo's `.claude/immutable/` — `/immutable:prd` reads from the absolute
    path directly, so no copy is needed.

  oh.completion.done: |
    ✅ DONE — design doc written, Approach {chosen_letter} approved.

  oh.completion.done_with_questions: |
    ⚠️  DONE_WITH_QUESTIONS — design doc written, but the Open Questions
    section is non-empty. Resolve these in `/immutable:prd` Stage 1.5:

    {open_questions}

  oh.completion.needs_context: |
    🛑 NEEDS_CONTEXT — some Phase 2 premises were not answered, so the
    design doc was NOT written. Unresolved premises:

    {unresolved}

    Gather more context and rerun `/immutable:office-hours` when ready.

  oh.refuse.write_during_oh: |
    `/immutable:office-hours` does not write code. This skill writes ONE transient
    design doc (`.claude/immutable/office-hours/`) — nothing else.

    Implementation work happens in the downstream skills (`/immutable:prd` →
    `/immutable:design` → `/immutable:plan-review-ceo` → `/immutable:plan-review-eng`
    → `/immutable:adr` → `/immutable:ship`).

  # ==========================================================================
  # design skill (v0.6.0)
  # ==========================================================================

  design.step1.pitch_picker_question: |
    Which pitch are you implementing? Active pitches found:

    {pitch_list}

    Pick by number or path. For non-pitch work (refactor, infra) type "refactor".

  design.step1.pitch_confirmation: |
    Selected pitch: `{pitch_path}` (`domain: {pitch_domain}`)

    Pitch summary:
    {pitch_summary}

    Does this pitch match the work?
    - (Y) Proceed
    - (N) Pick a different pitch
    - (S) Pitch is stale — supersede via `/immutable:prd` first, then rerun

  design.step1.no_pitches_found: |
    No active pitches in `{pitches_dir}`.

    Options:
    - (A) Author a new pitch via `/immutable:prd`, then rerun
    - (B) Proceed in refactor mode — implementation without a pitch (internal
      work, infra changes, etc.)
    - (C) Abort

  design.step1.refactor_mode_acknowledged: |
    Refactor mode — proceeding without a pitch. The transient note will be
    read by plan-review-ceo, but pitch-grounded questions will be skipped.

  design.step3.activation_question: |
    Activation status (required if the pitch's Open UX questions section is empty):

    1. Which version / when does this become user-visible?
    2. Hidden paths or feature flags gating it before launch? (Exact identifiers)
    3. Live trigger? (Metric / approval / date)

  design.step3.dependencies_question: |
    Dependent features:

    1. Other features sharing the same data / screen / service?
    2. Any of them in active development on a different branch?
    3. Does this work block, or is it blocked by, another feature's ship date?

  design.step3.module_question: |
    Module placement:

    1. Which module / package owns this work? (Specific: e.g., `lib/cart/`)
    2. Cross-module dependencies the pitch doesn't surface?
    3. Does this introduce a new module? If so, what's its boundary contract?

  design.step4.note_written: |
    Design handoff note written: `{path}`

    This note is the transient context that the next skill
    (`/immutable:plan-review-ceo`) reads in addition to the pitch + linked ADRs.
    It lives in the `.claude/immutable/` namespace and is gitignored.

  design.step4.handoff_to_plan_review_ceo: |
    Next step: `/immutable:plan-review-ceo`

    Review targets:
    - Pitch:        `{pitch_path}` (spec repo)
    - ADRs:         active ADRs linked to the pitch (plan-review-ceo auto-discovers)
    - Design note:  `{handoff_note_path}` (this step's output)

    Mode: `{repo_mode}` — {mode_specific_hint}

  design.refuse.spec_only_repo: |
    This directory is a spec-only repo (`repo_mode: two-repo-spec`).

    `/immutable:design` runs in the implementation repo (the pitch is already
    in the spec repo). Options:

    - (A) cd into the implementation repo (usually sibling `*-app`) and rerun
    - (B) If the spec repo was your intended target, `/immutable:prd` is the
      right tool

    Aborting.

  # ==========================================================================
  # plan-review-ceo skill (v0.6.0)
  # ==========================================================================

  prc.phase0.target_pitch_question: |
    Which pitch are we reviewing? Active pitches in the spec repo (`{spec_root}`):

    {pitch_list}

    Pick by number or path. For refactor mode (no pitch), type "refactor".

  prc.phase0.system_audit_summary: |
    System audit:
    - In-flight work: {in_flight}
    - Open PRs:       {open_prs}
    - Pain points:    {pain_points}
    - TODO/FIXME hotspots: {todo_hotspots}

    If anything above conflicts with the area this plan touches, it surfaces
    in Phase 1 first.

  prc.phase0.landscape_findings: |
    Landscape check (Phase 0.5 — scope expansion is on the table):
    - [Layer 1] tried-and-true: {layer1}
    - [Layer 2] popular practice: {layer2}
    - [Layer 3] first principles: {layer3}
    {eureka_block}

  prc.phase1.scope_locked: |
    Phase 1F decision locked:
      Mode:      {mode}
      Approach:  {approach_letter} ({approach_name})

    Confirmed scope:
    {in_scope}

    Out of scope (deferred or rejected):
    {out_of_scope}

    Triggers for downstream phases:
    - Pitch supersede candidate: {pitch_trigger}
    - ADR-authoring candidate:    {adr_trigger}

    This envelope does not change during Phase 2 (11 sections).

  prc.phase1.alternatives_required: |
    1C-bis is mandatory. At least 2 (preferably 3) distinct implementation
    approaches must be evaluated before mode selection (1F). If only 1
    approach genuinely exists, surface that explicitly with reasons.

  prc.phase1.premise_list: |
    PREMISES (assumed by the current plan):
    {numbered_premises}

    Each premise gets validated one at a time. If the design handoff note
    or the pitch has a "Premises" section, copy those as the starting set.

  prc.phase1.exit_to_office_hours: |
    The problem statement isn't stabilizing in this session (premises keep
    flipping or framing keeps changing). That's what `/immutable:office-hours`
    is for.

    Options:
    - (A) Run office-hours now and come back
    - (B) Keep going (the review will be shallower)

  prc.phase1.dream_state_template: |
    CURRENT STATE         THIS PLAN              12-MONTH IDEAL
    {current}    --->     {delta}        --->    {target}

  prc.phase1.mode_selection: |
    Mode selection (1F):

    1. SCOPE EXPANSION — plan is good but could be great. Dream big. Each
       expansion opted in individually via cherry-pick ceremony.
    2. SELECTIVE EXPANSION — scope is baseline. Surface possible cherry-picks.
       Neutral recommendations.
    3. HOLD SCOPE — scope is right. Review with maximum rigor. No expansions.
    4. SCOPE REDUCTION — plan is overbuilt. Propose minimal version, then
       review that.

    Recommended default: {default_mode} ({reason})

  prc.phase2.section_intro_template: |
    --- Section {n}: {section_name} ---
    {section_objective}

    Scope of this section:
    {scope_bullets}

    Issues are surfaced one at a time. After all are resolved, we move to
    the next section.

  prc.phase2.section_no_issues: "Section {n}: {section_name} — No issues found."

  prc.phase3.trigger_summary: |
    Phase 3 trigger summary:

    Pitch supersede candidates ({pitch_count}):
    {pitch_candidates}

    ADR-authoring candidates ({adr_count}):
    {adr_candidates}

    Transient note only ({minor_count}):
    {minor_notes}

  prc.phase3.pitch_supersede_recommendation: |
    Pitch supersede recommended: `{pitch_path}`

    Reason: {reason}

    Action: cd into the spec repo → `/immutable:prd` → append a new file in
    `pitches/{domain}/` (frontmatter `supersedes: {old_filename}`). This is
    a separate spec-repo PR from the implementation PR.

  prc.phase3.adr_authoring_recommendation: |
    ADR authoring recommended: decision = "{decision_summary}"

    Reason: {reason}

    Action: in the app repo, run `/immutable:adr` → append a new ADR in
    `adr/` (frontmatter `references.pitches: [{pitch_filename}]` to link
    this pitch). Bundle into this PR or split into a separate one (team
    convention).

  prc.phase4.verdict_question: |
    Phase 4 verdict:

    - APPROVE — proceed to `/immutable:plan-review-eng`. Phase 3 triggers
      can be acted on in parallel (pitch supersede is a spec-repo PR and
      doesn't block app-repo work).
    - REVISE — a pitch supersede or scope change must happen first. Pause
      review; rerun after pitch is updated.
    - REJECT — premises do not hold OR scope is fundamentally wrong.
      Recommend going back to `/immutable:office-hours`.

  prc.phase4.review_note_written: |
    Review note written: `{path}`

    Includes:
    - Verdict + one-line rationale
    - Phase 1F scope envelope (mode + approach)
    - Section 1-11 highlights
    - Phase 3 trigger candidates (pitch supersede, ADR authoring, transient)

  prc.phase4.handoff_to_plan_review_eng: |
    Verdict: {verdict}
    Review note: `{path}`

    {next_step_block}

    Phase 3 trigger reminders:
    {trigger_reminders}

  prc.refuse.spec_only_repo: |
    This directory is a spec-only repo (`repo_mode: two-repo-spec`).

    plan-review runs in the implementation repo. Options:
    - (A) cd into the implementation repo and rerun
    - (B) If the spec repo was your intended target, `/immutable:prd` is the
      right tool

    Aborting.

  prc.refuse.no_pitch: |
    No pitch found to review.

    Options:
    - (A) Author a new pitch via `/immutable:prd`, then rerun
    - (B) For refactor mode, run `/immutable:design` first in "refactor" mode
      to write the transient note, then rerun
    - (C) Abort

  prc.warn.no_design_note: |
    No design handoff note found at `{expected_path}`.

    Running `/immutable:design` first captures app-side context cleanly. To
    proceed without it, Phase 0 will need to gather that context manually.

    - (A) Pause and run `/immutable:design`
    - (B) Proceed without the note (Phase 0 grows)

  prc.critical.one_issue_one_question: |
    Reminder: surface one issue at a time. Batching multiple issues into a
    single AskUserQuestion makes partial answers awkward and lets later
    questions reference stale context.

  # ==========================================================================
  # plan-review-eng skill (v0.6.0)
  # ==========================================================================

  pre.phase0.mode_ceo_grounded: |
    Mode: ceo-grounded.

    CEO review note: `{ceo_note_path}` (verdict: APPROVE)
    Scope envelope (Phase 1F): {scope_summary}
    CEO Phase 3 trigger candidates: {trigger_summary}

    Running the 4-section review + worktree analysis on top of this envelope.
    Phase 0.3 scope check is skipped (CEO already handled it).

  pre.phase0.ceo_missing_question: |
    No CEO review note found (`{ceo_note_path}` is absent).

    Options:
    - (A) Proceed in standalone mode — eng review on its own, reading pitch +
      ADRs directly. Suited for small tasks, clear-scope work, or sprints
      focused on ADR authoring. The Phase 0.3 lightweight scope check is
      activated.
    - (B) Pause and run `/immutable:plan-review-ceo` first (recommended for
      non-trivial work — the full scope challenge + 11-section review is
      stronger)
    - (C) Abort

  pre.phase0.standalone_acknowledged: |
    Mode: standalone.

    Proceeding without a CEO review — eng review is the only review for this
    work. Phase 0.3's lightweight scope check is mandatory (replaces the CEO's
    nuclear scope challenge). Phase 3 ADR triggers have no CEO Phase 3 to
    cross-reference, so every architecture decision the eng review surfaces
    becomes a candidate.

  pre.phase0.standalone_scope_check: |
    Standalone scope check:
      Files touched:                                      {files_touched}
      New abstractions (services / classes / modules):    {new_abstractions}

    Threshold: ≥ 8 files OR ≥ 2 new abstractions ⇒ heavier than the standalone
    fast-path is intended for.
    {smell_status}

    {choice_block}

  pre.phase0.late_changes: |
    The branch has commits added AFTER the CEO review note was written:

    {commits_since_ceo}

    The CEO review didn't see these. The eng review will cover this delta too.

  pre.phase2.skip_summary: |
    Phase 2 (worktree analysis) skipped — reason: {reason}

    The review note will record: "Sequential implementation, no parallelization
    opportunity."

  pre.phase2.dependency_table_template: |
    Phase 2.2 dependency table:

    | Step | Modules touched | Depends on |
    |------|----------------|------------|
    {rows}

    Work at module / directory level (file-level guesses are unreliable).

  pre.phase2.parallel_lanes_template: |
    Phase 2.3 parallel lanes:

    {lanes}

    Steps touching the same module → same lane (sequential).
    Independent modules + no dependency → separate lanes (parallel).

  pre.phase2.execution_order_template: |
    Phase 2.4 execution order:

    {order_description}

  pre.phase2.conflict_flag_template: |
    ⚠️ Lane conflict: lanes {lane_a} and {lane_b} both touch module `{module}`.
    Potential merge conflict — consider sequential execution or careful coordination.

  pre.phase3.adr_recommendation: |
    ADR authoring recommended: "{adr_title}"

    Reason (Section {section}): {reason}

    Action: in the app repo, run `/immutable:adr`. The ADR must reference
    pitch `{pitch_filename}` (frontmatter `references.pitches: [{pitch_filename}]`).

    If this ADR was already flagged in the CEO review's Phase 3, cross-reference
    instead of duplicating.

  pre.phase4.verdict_question: |
    Phase 4 verdict (eng):

    - APPROVE — implement → (if needed) `/immutable:adr` → `/immutable:ship`.
      Phase 3 ADR triggers can be acted on before or during implementation.
    - REVISE — code-level issues affect plan shape. Pause; rerun after the
      plan is updated.
    - REJECT — eng concerns require scope or approach change. Recommend
      returning to plan-review-ceo or office-hours.

  pre.phase4.review_note_written: |
    Eng review note written: `{path}`

    Contains:
    - Verdict + one-line rationale
    - Section 1-4 highlights
    - Test Coverage Diagram (Section 3)
    - Worktree Analysis (Phase 2 — or skip rationale)
    - ADR-authoring candidates (Phase 3)
    - Late-changes note (when commits arrived after the CEO review)

  pre.phase4.handoff_to_ship: |
    Verdict: APPROVE
    Eng review note: `{path}`

    Recommended implementation order:
    1. If Phase 3 surfaced ADR triggers, run `/immutable:adr` first (or during
       implementation)
    2. Implement (use the Test Coverage Diagram as a checklist)
    3. After all tests green, run `/immutable:ship`

    ADR triggers surfaced in this review:
    {adr_triggers}

  pre.phase4.handoff_to_revise: |
    Verdict: {verdict}
    Eng review note: `{path}`

    {next_step_description}

    {recommendation}

  pre.refuse.spec_only_repo: |
    This directory is a spec-only repo (`repo_mode: two-repo-spec`).

    plan-review-eng runs in the implementation repo. cd into the implementation
    repo and rerun.

    Aborting.

  pre.refuse.ceo_not_approved: |
    The CEO review (`{ceo_note_path}`) is in REVISE / REJECT state — eng review
    cannot proceed.

    Current state: {ceo_status}

    The blockers the CEO surfaced (scope changes, pitch supersede, premise
    flips, etc.) must be resolved before eng review is meaningful.

    Options:
    - (A) Address the CEO's issues, then rerun `/immutable:plan-review-ceo`
      to obtain APPROVE (most common path)
    - (B) If a pitch supersede is needed, run `/immutable:prd` in the spec
      repo to supersede, then rerun CEO
    - (C) Abort

    Note: when the CEO review note is **missing entirely**, you can proceed
    in standalone mode instead (Phase 0.1's ceo_missing_question handles
    that branch). This refusal applies only when the note exists but the
    verdict is REVISE / REJECT.

  pre.refuse.no_pitch: |
    No pitch found, and refactor mode was not opted into.

    Standalone-mode eng review needs at least a pitch or a refactor context.

    Options:
    - (A) Author a new pitch via `/immutable:prd`, then rerun
    - (B) For refactor mode, run `/immutable:design` first (pick the
      "refactor" option in Step 1) to write the transient note, then rerun
    - (C) Abort

