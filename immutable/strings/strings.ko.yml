    이 스킬이 transient artifact를 디스크에 쓸 때 보호 브랜치에 직접 변경이 들어가지 않도록 주의하세요.
    팀 정책상 보호 브랜치 직접 작업이 금지된다면 작업용 브랜치로 먼저 분기하세요:
