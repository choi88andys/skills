  common.refuse_legacy_mode: |
    이 디렉토리는 immutable SDD 레포가 아닙니다 (`.immutable-prd/config.yml` 미발견).

    `/immutable:office-hours` `/immutable:design` `/immutable:plan-review-ceo` `/immutable:plan-review-eng` `/immutable:ship`
    스킬은 immutable-prd 모드 전용입니다.

    옵션:
    - 새 immutable SDD 레포로 부트스트랩: `/immutable:init`
    - 기존 spec/app 레포에서 호출: 해당 레포 디렉토리로 이동 후 다시 실행
    - 비표준 레이아웃: `.claude/sdd-mode` 포인터 파일 작성 (자세한 형식은 SCHEMA.md 참조)

    작업을 중단합니다.

